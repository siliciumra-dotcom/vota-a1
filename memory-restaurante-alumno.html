<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory A1 — Restaurante</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');
:root{--bg:#101c2b;--paper:#fff9ef;--ink:#2c2520;--muted:#756c64;--accent:#c94736;--accent2:#8f2f29;--green:#2f9c6b;--blue:#3478b9;--line:#e5d7c5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Nunito,system-ui;background:radial-gradient(circle at 12% 0,rgba(255,255,255,.1),transparent 22%),linear-gradient(135deg,var(--bg),#263a56);color:var(--ink);padding:12px}.wrap{max-width:980px;margin:auto}.panel{background:var(--paper);border-radius:24px;padding:18px;box-shadow:0 18px 42px rgba(0,0,0,.23);margin-top:12px}.hidden{display:none!important}.joinHero{text-align:center;padding:30px 18px}.joinHero .big{font-size:70px}h1,h2,h3{margin-top:0}input{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid #d9cbb9;font:inherit;outline:none}label{display:block;font-weight:900;margin:11px 0 6px}button{font:inherit;border:0;border-radius:14px;padding:12px 16px;font-weight:900;background:var(--accent);color:#fff;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.muted{font-size:13px;color:var(--muted)}.top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.player{background:#f5ecdf;border-radius:16px;padding:10px 12px;transition:.2s}.player.right{text-align:right}.player.turn{box-shadow:0 0 0 4px rgba(201,71,54,.22);transform:translateY(-2px)}.score{font-size:30px;font-weight:900;color:var(--accent)}.timer{text-align:center;background:#17263b;color:#fff;border-radius:18px;padding:9px 16px;font-size:27px;font-weight:900;font-variant-numeric:tabular-nums}.turnBanner{text-align:center;font-weight:900;margin:12px 0;padding:10px;border-radius:14px;background:#eee6db;transition:.2s}.turnBanner.mine{background:#e3f5ea;color:#236344;animation:pulse .8s ease}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;perspective:900px}.memoryCard{aspect-ratio:1/1.05;position:relative;cursor:pointer;border:0;padding:0;background:transparent;min-width:0}.memoryCard .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .38s cubic-bezier(.2,.75,.25,1);border-radius:16px}.memoryCard.revealed .inner,.memoryCard.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}.back{background:linear-gradient(145deg,var(--accent),var(--accent2));color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 7px 14px rgba(0,0,0,.14)}.back:before{content:'🍽️';font-size:30px;opacity:.95}.back:after{content:'?';position:absolute;right:9px;bottom:5px;font-size:18px;font-weight:900;opacity:.45}.front{background:#fffdf8;border:2px solid #eadbc7;transform:rotateY(180deg);box-shadow:0 7px 14px rgba(0,0,0,.11);padding:7px}.front.word{font-size:clamp(12px,2.5vw,18px);font-weight:900;text-align:center;line-height:1.1;color:#5a3029}.front.image svg{width:92%;height:92%;filter:drop-shadow(0 5px 5px rgba(60,40,20,.12))}.memoryCard.matched .front{border-color:var(--green);box-shadow:0 0 0 3px rgba(47,156,107,.18),0 8px 18px rgba(0,0,0,.12);animation:matchPop .42s ease}.memoryCard.blocked{cursor:default}.feedback{position:fixed;left:50%;top:18%;transform:translateX(-50%) scale(.8);padding:12px 18px;border-radius:999px;background:#fff;color:#256344;font-size:20px;font-weight:900;box-shadow:0 12px 35px rgba(0,0,0,.2);opacity:0;pointer-events:none;z-index:20}.feedback.show{animation:floatPoint 1s ease}.result{text-align:center;padding:26px}.result .cup{font-size:76px}.rule{display:flex;gap:8px;align-items:center;margin-top:9px;font-size:12px;color:var(--muted)}@keyframes pulse{50%{transform:scale(1.015)}}@keyframes matchPop{50%{transform:rotateY(180deg) scale(1.05)}}@keyframes floatPoint{0%{opacity:0;transform:translateX(-50%) translateY(15px) scale(.8)}25%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-22px) scale(1)}}@media(max-width:700px){.board{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.panel{padding:12px}.top{grid-template-columns:1fr 82px 1fr}.timer{font-size:20px;padding:9px 7px}.player{padding:8px}.score{font-size:24px}.front{padding:4px}}@media(max-width:390px){.board{grid-template-columns:repeat(4,1fr);gap:5px}.front.word{font-size:11px}.back:before{font-size:24px}}
</style></head><body><main class="wrap">
<section id="join" class="panel joinHero"><div class="big">🍽️</div><h1>MEMORY A1 · Restaurante</h1><p>Encuentra la pareja: <b>imagen + palabra</b></p><label>Código de la sala</label><input id="roomInput" inputmode="numeric" maxlength="6" placeholder="123456"><label>Tu nombre</label><input id="nickInput" maxlength="22" placeholder="Nombre"><button id="joinBtn" style="margin-top:14px;width:100%">Entrar</button><div id="joinStatus" class="muted" style="margin-top:9px"></div></section>
<section id="waiting" class="panel hidden result"><div class="cup">⏳</div><h2>¡Ya estás dentro!</h2><p>Espera a que el profesor forme las parejas.</p><div id="waitNick" class="muted"></div></section>
<section id="game" class="panel hidden"><div class="top"><div id="meBox" class="player"><div id="meName">Tú</div><div id="meScore" class="score">0</div></div><div id="timer" class="timer">05:00</div><div id="opBox" class="player right"><div id="opName">Rival</div><div id="opScore" class="score">0</div></div></div><div id="turnBanner" class="turnBanner">Preparando…</div><div id="board" class="board"></div><div class="rule">💡 Cada turno: descubre dos cartas. Si imagen y palabra coinciden, ganas 1 punto. Después juega tu rival.</div></section>
<div id="feedback" class="feedback">+1 ⭐</div>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';

import {firebaseConfig} from './firebase-config.js';
const VARIANT='restaurante',KIND='memory_restaurante_a1_2026',ART={"agua": "<rect x=\"42\" y=\"32\" width=\"44\" height=\"68\" rx=\"10\" fill=\"#e6f7ff\" stroke=\"#539ac4\" stroke-width=\"4\"/><path d=\"M47 58h34v35c-9 5-25 5-34 0z\" fill=\"#65c7ef\" opacity=\".75\"/><path d=\"M51 47c8-5 20-5 28 0\" fill=\"none\" stroke=\"#fff\" stroke-width=\"4\" stroke-linecap=\"round\"/>", "gas": "<rect x=\"42\" y=\"31\" width=\"44\" height=\"69\" rx=\"10\" fill=\"#edfaff\" stroke=\"#438fb9\" stroke-width=\"4\"/><path d=\"M47 58h34v35c-9 5-25 5-34 0z\" fill=\"#7ad3ee\"/><g fill=\"#fff\" opacity=\".95\"><circle cx=\"55\" cy=\"80\" r=\"3\"/><circle cx=\"70\" cy=\"70\" r=\"2.5\"/><circle cx=\"61\" cy=\"63\" r=\"2\"/><circle cx=\"75\" cy=\"86\" r=\"2\"/></g>", "cola": "<path d=\"M45 29h39l-5 72H50z\" fill=\"#f7f3ea\" stroke=\"#8b5a3c\" stroke-width=\"4\"/><path d=\"M50 52h29l-3 44H53z\" fill=\"#5d2d21\"/><path d=\"M70 22l10 37\" stroke=\"#c84a3c\" stroke-width=\"5\" stroke-linecap=\"round\"/><circle cx=\"60\" cy=\"64\" r=\"4\" fill=\"#ead6bd\" opacity=\".7\"/><circle cx=\"71\" cy=\"75\" r=\"4\" fill=\"#ead6bd\" opacity=\".7\"/>", "zumo": "<rect x=\"43\" y=\"34\" width=\"43\" height=\"66\" rx=\"9\" fill=\"#fff5df\" stroke=\"#d88924\" stroke-width=\"4\"/><path d=\"M48 53h33v40c-8 5-25 5-33 0z\" fill=\"#f6a623\"/><circle cx=\"88\" cy=\"44\" r=\"16\" fill=\"#ffb12a\" stroke=\"#d87914\" stroke-width=\"3\"/><path d=\"M88 30v28M74 44h28\" stroke=\"#ffe2a4\" stroke-width=\"2\"/>", "limonada": "<rect x=\"42\" y=\"33\" width=\"44\" height=\"67\" rx=\"9\" fill=\"#ffffed\" stroke=\"#c2a939\" stroke-width=\"4\"/><path d=\"M47 55h34v39c-8 5-26 5-34 0z\" fill=\"#f6e56a\"/><circle cx=\"87\" cy=\"44\" r=\"15\" fill=\"#f4df43\" stroke=\"#bda62b\" stroke-width=\"3\"/><path d=\"M87 31v26M74 44h26\" stroke=\"#fff7b6\" stroke-width=\"2\"/>", "cafe": "<ellipse cx=\"58\" cy=\"96\" rx=\"35\" ry=\"7\" fill=\"#d9c7b5\"/><path d=\"M35 48h50v38c0 15-10 20-25 20S35 101 35 86z\" fill=\"#fff8ef\" stroke=\"#8e674b\" stroke-width=\"4\"/><ellipse cx=\"60\" cy=\"50\" rx=\"23\" ry=\"9\" fill=\"#6b3526\"/><path d=\"M85 57c18-2 19 25 2 26\" fill=\"none\" stroke=\"#8e674b\" stroke-width=\"5\"/><path d=\"M48 34c-8-10 8-12 0-22M63 34c-8-10 8-12 0-22\" fill=\"none\" stroke=\"#c7a88d\" stroke-width=\"4\" stroke-linecap=\"round\"/>", "te": "<ellipse cx=\"59\" cy=\"96\" rx=\"34\" ry=\"7\" fill=\"#d9c7b5\"/><path d=\"M35 48h50v38c0 15-10 20-25 20S35 101 35 86z\" fill=\"#fff8ef\" stroke=\"#8e674b\" stroke-width=\"4\"/><ellipse cx=\"60\" cy=\"50\" rx=\"23\" ry=\"9\" fill=\"#bf7a32\"/><path d=\"M85 57c18-2 19 25 2 26\" fill=\"none\" stroke=\"#8e674b\" stroke-width=\"5\"/><path d=\"M72 23v35\" stroke=\"#6f6659\" stroke-width=\"2\"/><rect x=\"67\" y=\"53\" width=\"11\" height=\"15\" rx=\"2\" fill=\"#d9c2a5\"/>", "pizza": "<circle cx=\"64\" cy=\"66\" r=\"42\" fill=\"#d99445\" stroke=\"#9f5f2b\" stroke-width=\"4\"/><circle cx=\"64\" cy=\"66\" r=\"34\" fill=\"#f6c869\"/><path d=\"M41 51c12-9 35-8 46 1M38 75c14 9 38 10 52-1\" fill=\"none\" stroke=\"#d54c38\" stroke-width=\"6\" stroke-linecap=\"round\"/><g fill=\"#b43c31\"><circle cx=\"53\" cy=\"57\" r=\"5\"/><circle cx=\"75\" cy=\"49\" r=\"5\"/><circle cx=\"81\" cy=\"72\" r=\"5\"/><circle cx=\"53\" cy=\"80\" r=\"5\"/></g><g fill=\"#4e9b54\"><circle cx=\"65\" cy=\"62\" r=\"3\"/><circle cx=\"87\" cy=\"61\" r=\"3\"/><circle cx=\"43\" cy=\"66\" r=\"3\"/></g>", "ensalada": "<path d=\"M28 60h72c-3 32-16 44-36 44S31 92 28 60z\" fill=\"#e9eff2\" stroke=\"#70808a\" stroke-width=\"4\"/><g fill=\"#4fa85d\"><circle cx=\"46\" cy=\"57\" r=\"14\"/><circle cx=\"63\" cy=\"51\" r=\"15\"/><circle cx=\"80\" cy=\"57\" r=\"14\"/></g><g fill=\"#e85b46\"><circle cx=\"49\" cy=\"55\" r=\"6\"/><circle cx=\"78\" cy=\"53\" r=\"6\"/><circle cx=\"65\" cy=\"64\" r=\"6\"/></g><g fill=\"#f1d37a\"><rect x=\"55\" y=\"47\" width=\"8\" height=\"8\" rx=\"2\"/><rect x=\"72\" y=\"61\" width=\"8\" height=\"8\" rx=\"2\"/></g>", "pasta": "<path d=\"M27 65h74c-3 30-17 41-37 41S31 95 27 65z\" fill=\"#f1eee6\" stroke=\"#8b7867\" stroke-width=\"4\"/><g fill=\"none\" stroke=\"#e8b44d\" stroke-width=\"5\" stroke-linecap=\"round\"><path d=\"M40 65c7-18 16 14 22-3s14 17 22-2\"/><path d=\"M41 77c10-15 14 13 24-3s12 14 21-1\"/><path d=\"M47 88c8-10 16 8 30-2\"/></g><circle cx=\"66\" cy=\"63\" r=\"8\" fill=\"#d94b3e\"/><path d=\"M63 53c6-8 13-3 14 1\" stroke=\"#4d9255\" stroke-width=\"4\"/>", "hamburguesa": "<path d=\"M29 54c5-27 65-31 71 0z\" fill=\"#e6a64e\" stroke=\"#9c6330\" stroke-width=\"4\"/><path d=\"M31 56h67v10H31z\" fill=\"#4d9a4b\"/><path d=\"M34 66h61v13H34z\" fill=\"#6b3528\"/><path d=\"M33 79h63l-9 11H43z\" fill=\"#f4c746\"/><path d=\"M34 90h62c-4 17-58 18-62 0z\" fill=\"#d99342\" stroke=\"#9c6330\" stroke-width=\"4\"/><g fill=\"#f9e5b5\"><circle cx=\"49\" cy=\"43\" r=\"2\"/><circle cx=\"63\" cy=\"39\" r=\"2\"/><circle cx=\"78\" cy=\"44\" r=\"2\"/></g>", "paella": "<ellipse cx=\"64\" cy=\"72\" rx=\"43\" ry=\"30\" fill=\"#42464a\"/><ellipse cx=\"64\" cy=\"67\" rx=\"38\" ry=\"25\" fill=\"#f0c44f\"/><g fill=\"#e5563f\"><circle cx=\"49\" cy=\"58\" r=\"5\"/><circle cx=\"77\" cy=\"61\" r=\"5\"/><circle cx=\"66\" cy=\"77\" r=\"5\"/></g><g fill=\"#63a653\"><circle cx=\"57\" cy=\"68\" r=\"4\"/><circle cx=\"86\" cy=\"72\" r=\"4\"/></g><g stroke=\"#42464a\" stroke-width=\"5\"><path d=\"M21 70H9\"/><path d=\"M107 70h12\"/></g>", "tortilla": "<path d=\"M31 81c7-34 56-48 72-19L74 99c-16 5-35 0-43-18z\" fill=\"#efc457\" stroke=\"#a87b2d\" stroke-width=\"4\"/><path d=\"M42 78c13-17 33-22 48-16\" fill=\"none\" stroke=\"#f7de88\" stroke-width=\"7\"/><circle cx=\"57\" cy=\"79\" r=\"4\" fill=\"#d6a33d\"/><circle cx=\"75\" cy=\"72\" r=\"4\" fill=\"#d6a33d\"/>", "bocadillo": "<path d=\"M24 68c8-30 67-34 82-5L96 83H31z\" fill=\"#d79a49\" stroke=\"#905e2e\" stroke-width=\"4\"/><path d=\"M31 72h65\" stroke=\"#5ea450\" stroke-width=\"7\"/><path d=\"M34 79h59\" stroke=\"#c84d3e\" stroke-width=\"6\"/><path d=\"M35 58c14 6 31 4 46-2\" fill=\"none\" stroke=\"#f3cf8a\" stroke-width=\"4\"/>", "croquetas": "<ellipse cx=\"45\" cy=\"73\" rx=\"19\" ry=\"12\" fill=\"#d89a43\" stroke=\"#99602c\" stroke-width=\"4\" transform=\"rotate(-14 45 73)\"/><ellipse cx=\"67\" cy=\"64\" rx=\"19\" ry=\"12\" fill=\"#e1a54d\" stroke=\"#99602c\" stroke-width=\"4\" transform=\"rotate(8 67 64)\"/><ellipse cx=\"83\" cy=\"79\" rx=\"19\" ry=\"12\" fill=\"#cf8b38\" stroke=\"#99602c\" stroke-width=\"4\" transform=\"rotate(16 83 79)\"/><g fill=\"#f5c970\"><circle cx=\"42\" cy=\"69\" r=\"2\"/><circle cx=\"69\" cy=\"61\" r=\"2\"/><circle cx=\"84\" cy=\"76\" r=\"2\"/></g>", "cesar": "<path d=\"M27 62h74c-4 31-17 43-37 43S31 93 27 62z\" fill=\"#f2eee7\" stroke=\"#7c756d\" stroke-width=\"4\"/><g fill=\"#4f9d52\"><path d=\"M37 61c3-21 23-27 29-7 9-17 28-8 25 10z\"/><circle cx=\"54\" cy=\"63\" r=\"13\"/></g><g fill=\"#d9a34e\"><rect x=\"47\" y=\"52\" width=\"10\" height=\"10\" rx=\"2\"/><rect x=\"70\" y=\"58\" width=\"10\" height=\"10\" rx=\"2\"/></g><path d=\"M44 71c14-6 27-4 39 3\" stroke=\"#f7e4b7\" stroke-width=\"4\"/>", "griega": "<path d=\"M27 62h74c-4 31-17 43-37 43S31 93 27 62z\" fill=\"#f2eee7\" stroke=\"#7c756d\" stroke-width=\"4\"/><g fill=\"#56a158\"><circle cx=\"48\" cy=\"58\" r=\"12\"/><circle cx=\"72\" cy=\"57\" r=\"13\"/></g><g fill=\"#ef5a49\"><circle cx=\"54\" cy=\"63\" r=\"6\"/><circle cx=\"80\" cy=\"66\" r=\"6\"/></g><g fill=\"#fff5da\" stroke=\"#c5b99a\" stroke-width=\"1\"><rect x=\"61\" y=\"49\" width=\"10\" height=\"10\"/><rect x=\"43\" y=\"70\" width=\"10\" height=\"10\"/></g><g fill=\"#5b4639\"><circle cx=\"67\" cy=\"72\" r=\"4\"/><circle cx=\"84\" cy=\"55\" r=\"4\"/></g>", "quinoa": "<path d=\"M26 62h76c-4 31-18 43-38 43S30 93 26 62z\" fill=\"#e8edf0\" stroke=\"#667782\" stroke-width=\"4\"/><g fill=\"#d7b86c\"><circle cx=\"48\" cy=\"64\" r=\"12\"/><circle cx=\"64\" cy=\"58\" r=\"13\"/><circle cx=\"80\" cy=\"65\" r=\"12\"/></g><g fill=\"#58a85a\"><circle cx=\"45\" cy=\"54\" r=\"5\"/><circle cx=\"78\" cy=\"55\" r=\"5\"/></g><g fill=\"#e75a43\"><circle cx=\"59\" cy=\"67\" r=\"5\"/><circle cx=\"85\" cy=\"70\" r=\"5\"/></g>"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=s=>document.querySelector(s);
let user=null,code=null,nick='',room=null,pairId=null,serverOffset=0,lastScore=0,lastMatched=0,actionBusy=false,pendingCardId=null,pendingNonce=null;
const params=new URLSearchParams(location.search);if(params.get('room'))$('#roomInput').value=params.get('room').replace(/\D/g,'').slice(0,6);$('#nickInput').value=localStorage.getItem('memory_a1_nick')||'';
const now=()=>Date.now()+serverOffset,esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
onValue(ref(db,'.info/serverTimeOffset'),s=>serverOffset=Number(s.val()||0));signInAnonymously(auth).catch(e=>$('#joinStatus').textContent=e.message);onAuthStateChanged(auth,u=>user=u);$('#joinBtn').onclick=join;
function pair(){return pairId?room?.pairs?.[pairId]:null}function otherUid(){const p=pair();return p?.p1Uid===user?.uid?p?.p2Uid:p?.p1Uid}function myScore(){const p=pair();return p?.p1Uid===user?.uid?Number(p.score1||0):Number(p.score2||0)}function opScore(){const p=pair();return p?.p1Uid===user?.uid?Number(p.score2||0):Number(p.score1||0)}
async function join(){if(!user){$('#joinStatus').textContent='Conectando…';return}const c=$('#roomInput').value.replace(/\D/g,'').slice(0,6),n=$('#nickInput').value.trim().replace(/\s+/g,' ').slice(0,22);if(c.length!==6){$('#joinStatus').textContent='Escribe 6 números.';return}if(n.length<2){$('#joinStatus').textContent='Escribe tu nombre.';return}$('#joinBtn').disabled=true;try{const s=await get(ref(db,`memoryGames/${c}`)),r=s.val();if(!r||r.kind!==KIND)throw Error('No encuentro esta partida.');const ps=r.participants||{},already=!!ps[user.uid];if(!already&&Object.keys(ps).length>=20)throw Error('La sala está llena.');if(r.state?.status!=='lobby'&&!already)throw Error('La partida ya ha empezado.');code=c;nick=n;localStorage.setItem('memory_a1_nick',nick);if(!already)await set(ref(db,`memoryGames/${code}/participants/${user.uid}`),{nick,joinedAt:serverTimestamp()});$('#join').classList.add('hidden');$('#waiting').classList.remove('hidden');$('#waitNick').textContent=nick;onValue(ref(db,`memoryGames/${code}`),snap=>{room=snap.val();pairId=room?.pairingOf?.[user.uid]||null;render()})}catch(e){$('#joinStatus').textContent=e.message;$('#joinBtn').disabled=false}}
function svgFor(id){const inner=ART[id]||ART.agua||'';return `<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="paper" x1="0" x2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f7efe2"/></linearGradient></defs><rect x="3" y="3" width="122" height="122" rx="24" fill="url(#paper)"/>${inner}</svg>`}
function isRevealed(p,c){if((p.matched||{})[c.itemId])return true;return Object.values(p.flipped||{}).some(x=>x.cardId===c.cardId)}
function render(){if(!room)return;if(room.state?.status==='lobby'||!pairId)return;$('#waiting').classList.add('hidden');$('#game').classList.remove('hidden');const p=pair();if(!p)return;if(pendingNonce!==null&&(p.lastActionNonce===pendingNonce||p.turnUid!==user.uid||!!p.pendingResult||Object.values(p.flipped||{}).some(x=>x.cardId===pendingCardId))){actionBusy=false;pendingCardId=null;pendingNonce=null}if(p.status==='finished'){renderResult(p);return}const mineTurn=p.turnUid===user.uid,op=otherUid();$('#meName').textContent=nick||room.participants?.[user.uid]?.nick||'Tú';$('#opName').textContent=room.participants?.[op]?.nick||'Rival';$('#meScore').textContent=myScore();$('#opScore').textContent=opScore();$('#meBox').classList.toggle('turn',mineTurn);$('#opBox').classList.toggle('turn',!mineTurn);$('#turnBanner').textContent=mineTurn?'🎯 TU TURNO — elige dos cartas':'👀 TURNO DE '+(room.participants?.[op]?.nick||'tu rival');$('#turnBanner').classList.toggle('mine',mineTurn);const matched=Object.keys(p.matched||{}).length;if(myScore()>lastScore){const f=$('#feedback');f.classList.remove('show');void f.offsetWidth;f.classList.add('show')}lastScore=myScore();lastMatched=matched;$('#board').innerHTML=(p.deck||[]).map(c=>{const rev=isRevealed(p,c),mat=!!(p.matched||{})[c.itemId],blocked=!mineTurn||!!p.pendingResult||mat||actionBusy;return `<button class="memoryCard ${rev?'revealed':''} ${mat?'matched':''} ${blocked?'blocked':''}" data-card="${esc(c.cardId)}" ${blocked?'disabled':''}><span class="inner"><span class="face back"></span><span class="face front ${c.type}">${c.type==='image'?svgFor(c.itemId):esc(c.label)}</span></span></button>`}).join('');document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>playCard(b.dataset.card))}
async function playCard(cardId){const p=pair();if(actionBusy||!p||p.turnUid!==user.uid||p.pendingResult)return;const c=(p.deck||[]).find(x=>x.cardId===cardId);if(!c||(p.matched||{})[c.itemId]||Object.values(p.flipped||{}).some(x=>x.cardId===cardId))return;actionBusy=true;pendingCardId=cardId;pendingNonce=Date.now()+Math.random();try{await set(ref(db,`memoryGames/${code}/actions/${pairId}/${user.uid}`),{cardId,nonce:pendingNonce,at:serverTimestamp()})}catch(e){actionBusy=false;pendingCardId=null;pendingNonce=null;throw e}}
function renderResult(p){const me=myScore(),op=opScore(),opp=room.participants?.[otherUid()]?.nick||'Rival';let msg=me===op?'🤝 ¡Empate!':me>op?'🏆 ¡Has ganado!':`👏 Gana ${esc(opp)}`;$('#game').innerHTML=`<div class="result"><div class="cup">${me>op?'🏆':me===op?'🤝':'🎴'}</div><h1>${msg}</h1><h2>${me} : ${op}</h2><p>¡Buen trabajo! Habéis practicado vocabulario de restaurante.</p></div>`}
setInterval(()=>{const p=pair();if(!p||p.status==='finished')return;const left=Math.max(0,Number(p.endsAt||0)-now()),s=Math.ceil(left/1000);$('#timer').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},250);
</script></body></html>
