<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torneo de números — Profesor</title>
<style>
:root{--bg:#07111f;--card:#101d30;--card2:#14253d;--text:#f7fbff;--muted:#9eb0c8;--line:#263b57;--accent:#ffd166;--ok:#72e3a6;--danger:#ff7c8a}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 20% 0,#163058 0,#07111f 42%,#030813 100%);color:var(--text);min-height:100vh}
.wrap{max-width:1080px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:clamp(28px,5vw,50px);margin:0;letter-spacing:-.04em}.sub{color:var(--muted);margin:7px 0 0}
.badge{padding:9px 13px;border:1px solid var(--line);background:#0d192a;border-radius:999px;color:var(--muted);font-weight:800}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:22px}@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,rgba(20,37,61,.95),rgba(10,21,36,.95));border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 18px 50px #0005}
h2{margin:0 0 14px;font-size:20px}.room{font-size:clamp(44px,8vw,80px);font-weight:950;letter-spacing:.08em;margin:6px 0}
button{border:0;border-radius:15px;padding:13px 18px;font:inherit;font-weight:900;cursor:pointer;background:var(--accent);color:#172033}
button.secondary{background:#1a2d48;color:#fff;border:1px solid #355173}button:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap}.linkbox{margin-top:14px;padding:11px 13px;background:#081423;border:1px solid var(--line);border-radius:12px;color:#c9d7e7;word-break:break-all;font-size:13px}
.people{display:flex;flex-wrap:wrap;gap:8px}.person{background:#0a1728;border:1px solid var(--line);padding:8px 11px;border-radius:999px;font-weight:800}
.count{font-size:46px;font-weight:950}.muted{color:var(--muted)}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}.group{background:#091728;border:1px solid var(--line);border-radius:16px;padding:13px}
.group strong{display:block;margin-bottom:7px}.group .row{display:flex;justify-content:space-between;padding:4px 0;gap:12px}
.live{display:inline-flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok)}
.rank{width:100%;border-collapse:collapse}.rank th,.rank td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}.rank td:last-child,.rank th:last-child{text-align:right}
.status{padding:11px 13px;border-radius:12px;background:#081423;border:1px solid var(--line);color:#c9d7e7;margin-top:12px}.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>🚀 Torneo de números</h1><p class="sub">Una partida · 3 minutos · mismo reto para todos</p></div>
    <div class="badge" id="conn">conectando…</div>
  </div>

  <div class="grid">
    <section class="card">
      <h2>Código de la clase</h2>
      <div class="room" id="room">———</div>
      <div class="actions">
        <button id="create">Crear clase</button>
        <button class="secondary" id="copy" disabled>Copiar enlace alumno</button>
      </div>
      <div class="linkbox hidden" id="studentLink"></div>
      <div class="status" id="status">Crea una clase y espera a tus estudiantes.</div>
    </section>

    <section class="card">
      <h2>Jugadores</h2>
      <div><span class="count" id="count">0</span> <span class="muted">conectados</span></div>
      <div class="people" id="people"></div>
      <div style="height:14px"></div>
      <button id="start" disabled>⚡ Emparejar e iniciar en 5 s</button>
    </section>
  </div>

  <section class="card hidden" id="groupsCard" style="margin-top:18px">
    <h2>Duelo / grupos</h2>
    <div class="groups" id="groups"></div>
  </section>

  <section class="card hidden" id="liveCard" style="margin-top:18px">
    <h2><span class="live"><span class="dot"></span> Partida en curso</span></h2>
    <p class="muted" id="progress">Esperando resultados…</p>
  </section>

  <section class="card hidden" id="rankingCard" style="margin-top:18px">
    <h2>🏆 Clasificación general</h2>
    <table class="rank"><thead><tr><th>#</th><th>Jugador</th><th>Aciertos</th><th>Puntos</th></tr></thead><tbody id="ranking"></tbody></table>
  </section>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';
import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
import { getDatabase, ref, get, set, update, onValue, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js';
import { firebaseConfig } from './firebase-config.js';

const $=s=>document.querySelector(s);
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getDatabase(app);
let user=null, code=null, participants={}, groups={}, scores={}, unsubs=[];
const roomEl=$('#room'), createBtn=$('#create'), copyBtn=$('#copy'), startBtn=$('#start'), peopleEl=$('#people'), countEl=$('#count'), statusEl=$('#status'), studentLink=$('#studentLink'), groupsCard=$('#groupsCard'), groupsEl=$('#groups'), liveCard=$('#liveCard'), progressEl=$('#progress'), rankingCard=$('#rankingCard'), rankingEl=$('#ranking'), conn=$('#conn');

signInAnonymously(auth).catch(e=>statusEl.textContent='Error Firebase: '+e.message);
onAuthStateChanged(auth,u=>{user=u;if(u)conn.textContent='Firebase ✓';});

function roomRef(path=''){return ref(db,`tournaments/${code}${path?'/'+path:''}`)}
function clean(){unsubs.forEach(fn=>fn&&fn());unsubs=[]}
function studentUrl(){
  const u=new URL('torneo-alumno.html', location.href);
  u.searchParams.set('room',code); return u.href;
}
async function newCode(){
  for(let i=0;i<20;i++){
    const c=String(Math.floor(100000+Math.random()*900000));
    const s=await get(ref(db,`tournaments/${c}/hostUid`));
    if(!s.exists()) return c;
  }
  throw new Error('No pude crear un código. Prueba otra vez.');
}
function seed32(){
  const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]||123456789;
}
function shuffle(arr,seed){
  let t=seed>>>0; const rnd=()=>{t+=0x6D2B79F5;let x=t;x=Math.imul(x^x>>>15,x|1);x^=x+Math.imul(x^x>>>7,x|61);return((x^x>>>14)>>>0)/4294967296};
  const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a;
}
function makeGroups(players,seed){
  const p=shuffle(players,seed), out={}; let idx=0,g=1;
  if(p.length%2===1 && p.length>=3){
    while(p.length-idx>3){out['g'+g++]=p.slice(idx,idx+2);idx+=2}
    out['g'+g]=p.slice(idx,idx+3);
  }else{
    while(idx<p.length){out['g'+g++]=p.slice(idx,idx+2);idx+=2}
  }
  return out;
}
createBtn.onclick=async()=>{
  if(!user)return;
  createBtn.disabled=true;
  try{
    clean(); code=await newCode(); const seed=seed32();
    await set(ref(db,`tournaments/${code}/hostUid`),user.uid);
    await set(roomRef('meta'),{seed,durationMs:180000,countdownMs:5000,createdAt:serverTimestamp()});
    await set(roomRef('state'),{status:'lobby',createdAt:serverTimestamp()});
    roomEl.textContent=code; studentLink.textContent=studentUrl(); studentLink.classList.remove('hidden'); copyBtn.disabled=false;
    statusEl.textContent='Esperando jugadores…';
    subscribe();
  }catch(e){statusEl.textContent=e.message;createBtn.disabled=false}
};
copyBtn.onclick=async()=>{await navigator.clipboard.writeText(studentUrl());copyBtn.textContent='¡Copiado!';setTimeout(()=>copyBtn.textContent='Copiar enlace alumno',1200)};

function subscribe(){
  unsubs.push(onValue(roomRef('participants'),s=>{participants=s.val()||{};renderPeople();}));
  unsubs.push(onValue(roomRef('groups'),s=>{groups=s.val()||{};renderGroups();}));
  unsubs.push(onValue(roomRef('scores'),s=>{scores=s.val()||{};renderScores();}));
  unsubs.push(onValue(roomRef('state'),s=>{
    const st=s.val()||{};
    if(st.status==='playing'){startBtn.disabled=true;liveCard.classList.remove('hidden');statusEl.textContent='Partida iniciada. 3 minutos.'}
    if(st.status==='finished'){statusEl.textContent='Partida terminada.'}
  }));
}
function renderPeople(){
  const vals=Object.values(participants);
  countEl.textContent=vals.length;
  peopleEl.innerHTML=vals.map(p=>`<span class="person">${escapeHtml(p.nick||'Jugador')}</span>`).join('');
  startBtn.disabled=vals.length<2;
}
function renderGroups(){
  const keys=Object.keys(groups);
  groupsCard.classList.toggle('hidden',keys.length===0);
  groupsEl.innerHTML=keys.map((k,i)=>{
    const members=Object.values(groups[k]||{});
    return `<div class="group"><strong>${members.length===3?'Grupo':'Duelo'} ${i+1}</strong>${members.map(m=>`<div class="row"><span>${escapeHtml(m.nick)}</span><span>🚀</span></div>`).join('')}</div>`;
  }).join('');
}
function renderScores(){
  const total=Object.keys(participants).length, done=Object.keys(scores).length;
  if(done>0){liveCard.classList.remove('hidden');progressEl.textContent=`${done} / ${total} jugadores han terminado.`}
  if(total>0 && done>=total){
    rankingCard.classList.remove('hidden');
    const arr=Object.values(scores).sort((a,b)=>b.score-a.score || b.correct-a.correct);
    rankingEl.innerHTML=arr.map((s,i)=>`<tr><td>${i<3?['🥇','🥈','🥉'][i]:i+1}</td><td><strong>${escapeHtml(s.nick)}</strong></td><td>${s.correct}/${s.total}</td><td><strong>${s.score}</strong></td></tr>`).join('');
    set(roomRef('state/status'),'finished').catch(()=>{});
  }
}
startBtn.onclick=async()=>{
  const entries=Object.entries(participants).map(([uid,p])=>({uid,nick:p.nick||'Jugador'}));
  if(entries.length<2)return;
  startBtn.disabled=true;
  const meta=(await get(roomRef('meta'))).val()||{};
  const made=makeGroups(entries,Number(meta.seed||1));
  const groupObj={}, pairingOf={};
  Object.entries(made).forEach(([gid,list])=>{
    groupObj[gid]={};
    list.forEach(p=>{groupObj[gid][p.uid]={nick:p.nick};pairingOf[p.uid]=gid});
  });
  await set(roomRef('groups'),groupObj);
  await set(roomRef('pairingOf'),pairingOf);
  await set(roomRef('state'),{status:'playing',startAt:serverTimestamp(),durationMs:180000,countdownMs:5000});
};
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script>
</body>
</html>
