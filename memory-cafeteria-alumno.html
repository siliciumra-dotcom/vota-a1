<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory A1 — Cafetería</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');
:root{--bg:#101c2b;--paper:#fff9ef;--ink:#2c2520;--muted:#756c64;--accent:#9b5b2c;--accent2:#5d3825;--green:#2f9c6b;--blue:#3478b9;--line:#e5d7c5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Nunito,system-ui;background:radial-gradient(circle at 12% 0,rgba(255,255,255,.1),transparent 22%),linear-gradient(135deg,var(--bg),#263a56);color:var(--ink);padding:12px}.wrap{max-width:980px;margin:auto}.panel{background:var(--paper);border-radius:24px;padding:18px;box-shadow:0 18px 42px rgba(0,0,0,.23);margin-top:12px}.hidden{display:none!important}.joinHero{text-align:center;padding:30px 18px}.joinHero .big{font-size:70px}h1,h2,h3{margin-top:0}input{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid #d9cbb9;font:inherit;outline:none}label{display:block;font-weight:900;margin:11px 0 6px}button{font:inherit;border:0;border-radius:14px;padding:12px 16px;font-weight:900;background:var(--accent);color:#fff;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.muted{font-size:13px;color:var(--muted)}.top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.player{background:#f5ecdf;border-radius:16px;padding:10px 12px;transition:.2s}.player.right{text-align:right}.player.turn{box-shadow:0 0 0 4px rgba(155,91,44,.22);transform:translateY(-2px)}.score{font-size:30px;font-weight:900;color:var(--accent)}.timer{text-align:center;background:#17263b;color:#fff;border-radius:18px;padding:9px 16px;font-size:27px;font-weight:900;font-variant-numeric:tabular-nums}.turnBanner{text-align:center;font-weight:900;margin:12px 0;padding:10px;border-radius:14px;background:#eee6db;transition:.2s}.turnBanner.mine{background:#e3f5ea;color:#236344;animation:pulse .8s ease}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;perspective:900px}.memoryCard{aspect-ratio:1/1.05;position:relative;cursor:pointer;border:0;padding:0;background:transparent;min-width:0}.memoryCard .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .38s cubic-bezier(.2,.75,.25,1);border-radius:16px}.memoryCard.revealed .inner,.memoryCard.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}.back{background:linear-gradient(145deg,var(--accent),var(--accent2));color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 7px 14px rgba(0,0,0,.14)}.back:before{content:'☕';font-size:30px;opacity:.95}.back:after{content:'?';position:absolute;right:9px;bottom:5px;font-size:18px;font-weight:900;opacity:.45}.front{background:#fffdf8;border:2px solid #eadbc7;transform:rotateY(180deg);box-shadow:0 7px 14px rgba(0,0,0,.11);padding:7px}.front.word{font-size:clamp(12px,2.5vw,18px);font-weight:900;text-align:center;line-height:1.1;color:#5a3029}.front.image svg{width:92%;height:92%;filter:drop-shadow(0 5px 5px rgba(60,40,20,.12))}.memoryCard.matched .front{border-color:var(--green);box-shadow:0 0 0 3px rgba(47,156,107,.18),0 8px 18px rgba(0,0,0,.12);animation:matchPop .42s ease}.memoryCard.blocked{cursor:default}.feedback{position:fixed;left:50%;top:18%;transform:translateX(-50%) scale(.8);padding:12px 18px;border-radius:999px;background:#fff;color:#256344;font-size:20px;font-weight:900;box-shadow:0 12px 35px rgba(0,0,0,.2);opacity:0;pointer-events:none;z-index:20}.feedback.show{animation:floatPoint 1s ease}.result{text-align:center;padding:26px}.result .cup{font-size:76px}.rule{display:flex;gap:8px;align-items:center;margin-top:9px;font-size:12px;color:var(--muted)}@keyframes pulse{50%{transform:scale(1.015)}}@keyframes matchPop{50%{transform:rotateY(180deg) scale(1.05)}}@keyframes floatPoint{0%{opacity:0;transform:translateX(-50%) translateY(15px) scale(.8)}25%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-22px) scale(1)}}@media(max-width:700px){.board{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.panel{padding:12px}.top{grid-template-columns:1fr 82px 1fr}.timer{font-size:20px;padding:9px 7px}.player{padding:8px}.score{font-size:24px}.front{padding:4px}}@media(max-width:390px){.board{grid-template-columns:repeat(4,1fr);gap:5px}.front.word{font-size:11px}.back:before{font-size:24px}}
</style></head><body><main class="wrap">
<section id="join" class="panel joinHero"><div class="big">☕</div><h1>MEMORY A1 · Cafetería</h1><p>Encuentra la pareja: <b>imagen + palabra</b></p><label>Código de la sala</label><input id="roomInput" inputmode="numeric" maxlength="6" placeholder="123456"><label>Tu nombre</label><input id="nickInput" maxlength="22" placeholder="Nombre"><button id="joinBtn" style="margin-top:14px;width:100%">Entrar</button><div id="joinStatus" class="muted" style="margin-top:9px"></div></section>
<section id="waiting" class="panel hidden result"><div class="cup">⏳</div><h2>¡Ya estás dentro!</h2><p>Espera a que el profesor forme las parejas.</p><div id="waitNick" class="muted"></div></section>
<section id="game" class="panel hidden"><div class="top"><div id="meBox" class="player"><div id="meName">Tú</div><div id="meScore" class="score">0</div></div><div id="timer" class="timer">05:00</div><div id="opBox" class="player right"><div id="opName">Rival</div><div id="opScore" class="score">0</div></div></div><div id="turnBanner" class="turnBanner">Preparando…</div><div id="board" class="board"></div><div class="rule">💡 Cada turno: descubre dos cartas. Si imagen y palabra coinciden, ganas 1 punto. Después juega tu rival.</div></section>
<div id="feedback" class="feedback">+1 ⭐</div>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';

import {firebaseConfig} from './firebase-config.js';
const VARIANT='cafeteria',KIND='memory_cafeteria_a1_2026',ART={"solo": "<ellipse cx=\"62\" cy=\"91\" rx=\"32\" ry=\"7\" fill=\"#d7c8b5\"/><path d=\"M39 51h46v30c0 13-10 18-23 18S39 94 39 81z\" fill=\"#faf2e7\" stroke=\"#75523d\" stroke-width=\"4\"/><ellipse cx=\"62\" cy=\"52\" rx=\"20\" ry=\"8\" fill=\"#4f251a\"/><path d=\"M85 58c15-1 16 20 2 22\" fill=\"none\" stroke=\"#75523d\" stroke-width=\"5\"/>", "cortado": "<ellipse cx=\"62\" cy=\"91\" rx=\"32\" ry=\"7\" fill=\"#d7c8b5\"/><path d=\"M39 51h46v30c0 13-10 18-23 18S39 94 39 81z\" fill=\"#faf2e7\" stroke=\"#75523d\" stroke-width=\"4\"/><ellipse cx=\"62\" cy=\"52\" rx=\"20\" ry=\"8\" fill=\"#7d4a36\"/><ellipse cx=\"62\" cy=\"51\" rx=\"14\" ry=\"5\" fill=\"#d9b08b\"/><path d=\"M85 58c15-1 16 20 2 22\" fill=\"none\" stroke=\"#75523d\" stroke-width=\"5\"/>", "leche": "<ellipse cx=\"62\" cy=\"94\" rx=\"34\" ry=\"7\" fill=\"#d7c8b5\"/><path d=\"M36 44h52v40c0 14-10 20-26 20S36 98 36 84z\" fill=\"#fbf5ea\" stroke=\"#75523d\" stroke-width=\"4\"/><ellipse cx=\"62\" cy=\"46\" rx=\"23\" ry=\"9\" fill=\"#b67d55\"/><path d=\"M48 45c8-8 19-8 28 0-7 8-20 8-28 0z\" fill=\"#f7ead9\"/><path d=\"M88 55c18-1 19 25 2 26\" fill=\"none\" stroke=\"#75523d\" stroke-width=\"5\"/>", "capuccino": "<ellipse cx=\"62\" cy=\"94\" rx=\"34\" ry=\"7\" fill=\"#d7c8b5\"/><path d=\"M36 44h52v40c0 14-10 20-26 20S36 98 36 84z\" fill=\"#fbf5ea\" stroke=\"#75523d\" stroke-width=\"4\"/><ellipse cx=\"62\" cy=\"46\" rx=\"23\" ry=\"9\" fill=\"#b67d55\"/><path d=\"M48 45c8-10 19-10 28 0-6 10-21 10-28 0z\" fill=\"#fff1dc\"/><path d=\"M55 44c4-5 10-5 14 0-4 5-10 5-14 0z\" fill=\"#c18d68\"/><path d=\"M88 55c18-1 19 25 2 26\" fill=\"none\" stroke=\"#75523d\" stroke-width=\"5\"/>", "frio": "<path d=\"M42 28h44l-4 76H47z\" fill=\"#eef7f8\" stroke=\"#6f8b91\" stroke-width=\"4\"/><path d=\"M47 54h34l-3 45H50z\" fill=\"#8d5d42\"/><g fill=\"#dbeaf0\" stroke=\"#aec3cb\"><rect x=\"51\" y=\"43\" width=\"12\" height=\"12\" rx=\"3\" transform=\"rotate(12 57 49)\"/><rect x=\"66\" y=\"36\" width=\"13\" height=\"13\" rx=\"3\" transform=\"rotate(-10 72 42)\"/><rect x=\"66\" y=\"55\" width=\"12\" height=\"12\" rx=\"3\"/></g><path d=\"M72 18l11 48\" stroke=\"#4e5960\" stroke-width=\"4\"/>", "te": "<ellipse cx=\"59\" cy=\"96\" rx=\"34\" ry=\"7\" fill=\"#d9c7b5\"/><path d=\"M35 48h50v38c0 15-10 20-25 20S35 101 35 86z\" fill=\"#fff8ef\" stroke=\"#8e674b\" stroke-width=\"4\"/><ellipse cx=\"60\" cy=\"50\" rx=\"23\" ry=\"9\" fill=\"#bf7a32\"/><path d=\"M85 57c18-2 19 25 2 26\" fill=\"none\" stroke=\"#8e674b\" stroke-width=\"5\"/><path d=\"M72 23v35\" stroke=\"#6f6659\" stroke-width=\"2\"/><rect x=\"67\" y=\"53\" width=\"11\" height=\"15\" rx=\"2\" fill=\"#d9c2a5\"/>", "chocolate": "<ellipse cx=\"62\" cy=\"94\" rx=\"34\" ry=\"7\" fill=\"#d7c8b5\"/><path d=\"M36 45h52v39c0 14-10 20-26 20S36 98 36 84z\" fill=\"#fff6ec\" stroke=\"#75523d\" stroke-width=\"4\"/><ellipse cx=\"62\" cy=\"47\" rx=\"23\" ry=\"9\" fill=\"#60301f\"/><path d=\"M47 45c8-10 22-10 30 0\" fill=\"none\" stroke=\"#fff4e2\" stroke-width=\"8\" stroke-linecap=\"round\"/><path d=\"M88 56c18-1 19 25 2 26\" fill=\"none\" stroke=\"#75523d\" stroke-width=\"5\"/>", "zumo": "<rect x=\"43\" y=\"34\" width=\"43\" height=\"66\" rx=\"9\" fill=\"#fff5df\" stroke=\"#d88924\" stroke-width=\"4\"/><path d=\"M48 53h33v40c-8 5-25 5-33 0z\" fill=\"#f6a623\"/><circle cx=\"88\" cy=\"44\" r=\"16\" fill=\"#ffb12a\" stroke=\"#d87914\" stroke-width=\"3\"/><path d=\"M88 30v28M74 44h28\" stroke=\"#ffe2a4\" stroke-width=\"2\"/>", "agua": "<rect x=\"42\" y=\"32\" width=\"44\" height=\"68\" rx=\"10\" fill=\"#e6f7ff\" stroke=\"#539ac4\" stroke-width=\"4\"/><path d=\"M47 58h34v35c-9 5-25 5-34 0z\" fill=\"#65c7ef\" opacity=\".75\"/><path d=\"M51 47c8-5 20-5 28 0\" fill=\"none\" stroke=\"#fff\" stroke-width=\"4\" stroke-linecap=\"round\"/>", "infusion": "<path d=\"M38 45h48v40c0 13-9 18-24 18S38 98 38 85z\" fill=\"#f9faf4\" stroke=\"#637a69\" stroke-width=\"4\"/><ellipse cx=\"62\" cy=\"47\" rx=\"21\" ry=\"8\" fill=\"#d9b65b\"/><path d=\"M86 56c17-1 18 23 2 25\" fill=\"none\" stroke=\"#637a69\" stroke-width=\"5\"/><path d=\"M64 28c8 5 9 13 1 20-8-5-8-14-1-20z\" fill=\"#68a65b\"/><path d=\"M65 45l-1-15\" stroke=\"#527d4b\" stroke-width=\"2\"/>", "croissant": "<path d=\"M27 72c6-33 26-45 39-25 14-20 34-6 38 25-11 13-24 16-38 6-13 10-28 7-39-6z\" fill=\"#e6a34b\" stroke=\"#9c652f\" stroke-width=\"4\"/><path d=\"M47 53c-6 8-7 17-2 27M66 47c-4 11-3 22 1 31M85 53c5 9 5 18 1 27\" fill=\"none\" stroke=\"#f3c979\" stroke-width=\"4\"/>", "tostada": "<path d=\"M32 40c0-17 18-22 32-14 14-8 32-3 32 14l-7 57H39z\" fill=\"#d99d5b\" stroke=\"#8e5d33\" stroke-width=\"4\"/><path d=\"M39 48c14-7 35-7 50 0l-5 40H44z\" fill=\"#efc381\"/><path d=\"M43 55c10-8 31-8 42 1\" stroke=\"#d94f3e\" stroke-width=\"10\" stroke-linecap=\"round\"/><g fill=\"#ba352f\"><circle cx=\"52\" cy=\"69\" r=\"3\"/><circle cx=\"73\" cy=\"62\" r=\"3\"/><circle cx=\"79\" cy=\"76\" r=\"3\"/></g>", "aguacate": "<path d=\"M32 40c0-17 18-22 32-14 14-8 32-3 32 14l-7 57H39z\" fill=\"#d99d5b\" stroke=\"#8e5d33\" stroke-width=\"4\"/><path d=\"M39 48c14-7 35-7 50 0l-5 40H44z\" fill=\"#efc381\"/><path d=\"M44 61c9-12 30-13 41-1-8 16-34 17-41 1z\" fill=\"#78a947\"/><path d=\"M51 75c9-7 20-8 28-2\" stroke=\"#5d8835\" stroke-width=\"5\"/>", "bocadillo": "<path d=\"M24 68c8-30 67-34 82-5L96 83H31z\" fill=\"#d79a49\" stroke=\"#905e2e\" stroke-width=\"4\"/><path d=\"M31 72h65\" stroke=\"#5ea450\" stroke-width=\"7\"/><path d=\"M34 79h59\" stroke=\"#c84d3e\" stroke-width=\"6\"/><path d=\"M35 58c14 6 31 4 46-2\" fill=\"none\" stroke=\"#f3cf8a\" stroke-width=\"4\"/>", "tortilla": "<path d=\"M31 81c7-34 56-48 72-19L74 99c-16 5-35 0-43-18z\" fill=\"#efc457\" stroke=\"#a87b2d\" stroke-width=\"4\"/><path d=\"M42 78c13-17 33-22 48-16\" fill=\"none\" stroke=\"#f7de88\" stroke-width=\"7\"/><circle cx=\"57\" cy=\"79\" r=\"4\" fill=\"#d6a33d\"/><circle cx=\"75\" cy=\"72\" r=\"4\" fill=\"#d6a33d\"/>", "tarta": "<path d=\"M38 92h55L76 37 38 56z\" fill=\"#d46c72\" stroke=\"#8f4550\" stroke-width=\"4\"/><path d=\"M42 59h42\" stroke=\"#f4d6be\" stroke-width=\"8\"/><path d=\"M47 75h41\" stroke=\"#f4d6be\" stroke-width=\"7\"/><path d=\"M74 34c9 0 14 7 9 13-7 1-12-4-9-13z\" fill=\"#d9474c\"/><circle cx=\"80\" cy=\"35\" r=\"3\" fill=\"#6d9b46\"/>", "galleta": "<circle cx=\"64\" cy=\"65\" r=\"39\" fill=\"#d99a4d\" stroke=\"#925e2e\" stroke-width=\"4\"/><g fill=\"#5c3929\"><circle cx=\"49\" cy=\"50\" r=\"5\"/><circle cx=\"73\" cy=\"44\" r=\"4\"/><circle cx=\"82\" cy=\"67\" r=\"5\"/><circle cx=\"56\" cy=\"76\" r=\"4\"/><circle cx=\"72\" cy=\"87\" r=\"4\"/></g><g fill=\"#f0be70\"><circle cx=\"62\" cy=\"59\" r=\"3\"/><circle cx=\"43\" cy=\"66\" r=\"3\"/></g>", "yogur": "<path d=\"M31 61h67c-3 30-16 43-34 43S34 91 31 61z\" fill=\"#f6f4f0\" stroke=\"#8d8b86\" stroke-width=\"4\"/><path d=\"M37 66h55\" stroke=\"#fff\" stroke-width=\"12\"/><g fill=\"#d94e55\"><circle cx=\"48\" cy=\"61\" r=\"7\"/><circle cx=\"74\" cy=\"59\" r=\"7\"/></g><g fill=\"#6d9d4a\"><circle cx=\"62\" cy=\"55\" r=\"6\"/></g><g fill=\"#e2a84e\"><circle cx=\"84\" cy=\"68\" r=\"5\"/><circle cx=\"56\" cy=\"72\" r=\"5\"/></g>", "fruta": "<ellipse cx=\"64\" cy=\"88\" rx=\"39\" ry=\"14\" fill=\"#d8dde0\" stroke=\"#77858b\" stroke-width=\"3\"/><circle cx=\"46\" cy=\"66\" r=\"15\" fill=\"#e34e45\"/><circle cx=\"70\" cy=\"68\" r=\"16\" fill=\"#f1b13b\"/><circle cx=\"85\" cy=\"60\" r=\"13\" fill=\"#8abf4f\"/><path d=\"M43 49c6-8 13-8 18-1\" stroke=\"#5d8a42\" stroke-width=\"4\"/><path d=\"M80 43c5-7 11-6 15 0\" stroke=\"#5d8a42\" stroke-width=\"4\"/>", "sandwich": "<path d=\"M30 89L64 35l34 54z\" fill=\"#e8bf75\" stroke=\"#976335\" stroke-width=\"4\"/><path d=\"M38 80L64 43l26 37z\" fill=\"#fff1c7\"/><path d=\"M44 74l20-23 20 23\" fill=\"none\" stroke=\"#58a253\" stroke-width=\"9\"/><path d=\"M48 80l16-16 16 16\" fill=\"none\" stroke=\"#d84e3d\" stroke-width=\"6\"/>"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=s=>document.querySelector(s);
let user=null,code=null,nick='',room=null,pairId=null,serverOffset=0,lastScore=0,lastMatched=0,actionBusy=false,pendingCardId=null,pendingNonce=null;
const params=new URLSearchParams(location.search);if(params.get('room'))$('#roomInput').value=params.get('room').replace(/\D/g,'').slice(0,6);$('#nickInput').value=localStorage.getItem('memory_a1_nick')||'';
const now=()=>Date.now()+serverOffset,esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
onValue(ref(db,'.info/serverTimeOffset'),s=>serverOffset=Number(s.val()||0));signInAnonymously(auth).catch(e=>$('#joinStatus').textContent=e.message);onAuthStateChanged(auth,u=>user=u);$('#joinBtn').onclick=join;
function pair(){return pairId?room?.pairs?.[pairId]:null}function otherUid(){const p=pair();return p?.p1Uid===user?.uid?p?.p2Uid:p?.p1Uid}function myScore(){const p=pair();return p?.p1Uid===user?.uid?Number(p.score1||0):Number(p.score2||0)}function opScore(){const p=pair();return p?.p1Uid===user?.uid?Number(p.score2||0):Number(p.score1||0)}
async function join(){if(!user){$('#joinStatus').textContent='Conectando…';return}const c=$('#roomInput').value.replace(/\D/g,'').slice(0,6),n=$('#nickInput').value.trim().replace(/\s+/g,' ').slice(0,22);if(c.length!==6){$('#joinStatus').textContent='Escribe 6 números.';return}if(n.length<2){$('#joinStatus').textContent='Escribe tu nombre.';return}$('#joinBtn').disabled=true;try{const s=await get(ref(db,`memoryGames/${c}`)),r=s.val();if(!r||r.kind!==KIND)throw Error('No encuentro esta partida.');const ps=r.participants||{},already=!!ps[user.uid];if(!already&&Object.keys(ps).length>=20)throw Error('La sala está llena.');if(r.state?.status!=='lobby'&&!already)throw Error('La partida ya ha empezado.');code=c;nick=n;localStorage.setItem('memory_a1_nick',nick);if(!already)await set(ref(db,`memoryGames/${code}/participants/${user.uid}`),{nick,joinedAt:serverTimestamp()});$('#join').classList.add('hidden');$('#waiting').classList.remove('hidden');$('#waitNick').textContent=nick;onValue(ref(db,`memoryGames/${code}`),snap=>{room=snap.val();pairId=room?.pairingOf?.[user.uid]||null;render()})}catch(e){$('#joinStatus').textContent=e.message;$('#joinBtn').disabled=false}}
function svgFor(id){const inner=ART[id]||ART.agua||'';return `<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="paper" x1="0" x2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f7efe2"/></linearGradient></defs><rect x="3" y="3" width="122" height="122" rx="24" fill="url(#paper)"/>${inner}</svg>`}
function isRevealed(p,c){if((p.matched||{})[c.itemId])return true;return Object.values(p.flipped||{}).some(x=>x.cardId===c.cardId)}
function render(){if(!room)return;if(room.state?.status==='lobby'||!pairId)return;$('#waiting').classList.add('hidden');$('#game').classList.remove('hidden');const p=pair();if(!p)return;if(pendingNonce!==null&&(p.lastActionNonce===pendingNonce||p.turnUid!==user.uid||!!p.pendingResult||Object.values(p.flipped||{}).some(x=>x.cardId===pendingCardId))){actionBusy=false;pendingCardId=null;pendingNonce=null}if(p.status==='finished'){renderResult(p);return}const mineTurn=p.turnUid===user.uid,op=otherUid();$('#meName').textContent=nick||room.participants?.[user.uid]?.nick||'Tú';$('#opName').textContent=room.participants?.[op]?.nick||'Rival';$('#meScore').textContent=myScore();$('#opScore').textContent=opScore();$('#meBox').classList.toggle('turn',mineTurn);$('#opBox').classList.toggle('turn',!mineTurn);$('#turnBanner').textContent=mineTurn?'🎯 TU TURNO — elige dos cartas':'👀 TURNO DE '+(room.participants?.[op]?.nick||'tu rival');$('#turnBanner').classList.toggle('mine',mineTurn);const matched=Object.keys(p.matched||{}).length;if(myScore()>lastScore){const f=$('#feedback');f.classList.remove('show');void f.offsetWidth;f.classList.add('show')}lastScore=myScore();lastMatched=matched;$('#board').innerHTML=(p.deck||[]).map(c=>{const rev=isRevealed(p,c),mat=!!(p.matched||{})[c.itemId],blocked=!mineTurn||!!p.pendingResult||mat||actionBusy;return `<button class="memoryCard ${rev?'revealed':''} ${mat?'matched':''} ${blocked?'blocked':''}" data-card="${esc(c.cardId)}" ${blocked?'disabled':''}><span class="inner"><span class="face back"></span><span class="face front ${c.type}">${c.type==='image'?svgFor(c.itemId):esc(c.label)}</span></span></button>`}).join('');document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>playCard(b.dataset.card))}
async function playCard(cardId){const p=pair();if(actionBusy||!p||p.turnUid!==user.uid||p.pendingResult)return;const c=(p.deck||[]).find(x=>x.cardId===cardId);if(!c||(p.matched||{})[c.itemId]||Object.values(p.flipped||{}).some(x=>x.cardId===cardId))return;actionBusy=true;pendingCardId=cardId;pendingNonce=Date.now()+Math.random();try{await set(ref(db,`memoryGames/${code}/actions/${pairId}/${user.uid}`),{cardId,nonce:pendingNonce,at:serverTimestamp()})}catch(e){actionBusy=false;pendingCardId=null;pendingNonce=null;throw e}}
function renderResult(p){const me=myScore(),op=opScore(),opp=room.participants?.[otherUid()]?.nick||'Rival';let msg=me===op?'🤝 ¡Empate!':me>op?'🏆 ¡Has ganado!':`👏 Gana ${esc(opp)}`;$('#game').innerHTML=`<div class="result"><div class="cup">${me>op?'🏆':me===op?'🤝':'🎴'}</div><h1>${msg}</h1><h2>${me} : ${op}</h2><p>¡Buen trabajo! Habéis practicado vocabulario de cafetería.</p></div>`}
setInterval(()=>{const p=pair();if(!p||p.status==='finished')return;const left=Math.max(0,Number(p.endsAt||0)-now()),s=Math.ceil(left/1000);$('#timer').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},250);
</script></body></html>
