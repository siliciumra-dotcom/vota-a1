<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profesor · Cata de pantalla</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap');
:root{--bg:#0d1020;--card:#171a30;--line:#343a5c;--text:#fbfbff;--muted:#a9afca;--accent:#ffd15c;--pink:#ef5c9c;--green:#4ed8a1}
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Poppins,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 10%,#7245cc55,transparent 28%),radial-gradient(circle at 90% 20%,#e44d9250,transparent 26%),linear-gradient(145deg,#0b0d1b,#19132f);padding:20px}
.wrap{width:min(1160px,100%);margin:auto} .top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px} .brand{font-size:clamp(24px,4vw,38px);font-weight:900} .badge{padding:7px 11px;border:1px solid var(--line);border-radius:999px;color:#c8cce0;background:#101326;font-size:12px;font-weight:800}
.card{background:#14182be9;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 24px 65px #0007} .hidden{display:none!important} .center{text-align:center} .muted{color:var(--muted)}
button{font:inherit;border:0;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer;background:var(--accent);color:#171829} button:disabled{opacity:.45;cursor:not-allowed} .secondary{background:#252b49;color:white;border:1px solid #444d76} .pink{background:var(--pink);color:white} .green{background:var(--green)}
.hero h1{font-size:clamp(34px,6vw,66px);margin:0 0 6px} .code{font-size:clamp(55px,11vw,110px);font-weight:900;letter-spacing:.08em;color:var(--accent);line-height:1} .link{max-width:760px;margin:12px auto;background:#0c1020;border:1px solid #343c60;border-radius:14px;padding:10px;word-break:break-all;color:#bfc8e0;font-size:12px}
.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap} .players{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0 8px} .player{padding:7px 11px;border:1px solid #3c456b;border-radius:999px;background:#1c213a;font-size:13px;font-weight:800}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.65fr);gap:18px} .sampleNo{font-size:13px;letter-spacing:.15em;color:var(--accent);font-weight:900} .sampleBig{font-size:clamp(48px,9vw,105px);font-weight:900;line-height:1;margin:10px 0} .status{font-size:16px;font-weight:800;color:#c6cbe0}
.voteCards{display:grid;gap:10px;margin:20px 0} .voteRow{display:grid;grid-template-columns:190px 1fr 58px;gap:10px;align-items:center} .voteName{font-weight:900} .bar{height:26px;border-radius:999px;background:#0d1120;border:1px solid #353d5f;overflow:hidden} .fill{height:100%;width:0;transition:.3s width;background:linear-gradient(90deg,#795be8,#ef5c9c)} .count{text-align:right;font-weight:900}
.info{margin-top:15px;padding:15px;border-radius:16px;background:#0f1324;border:1px solid #383f62} .info strong{font-size:22px} .samples{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:15px 0} .sbtn{background:#252a45;color:white;border:1px solid #444b70;padding:10px 5px;font-size:12px} .sbtn.active{background:var(--accent);color:#171829}
table{width:100%;border-collapse:collapse} td,th{padding:9px 5px;border-bottom:1px solid #313754;text-align:left;font-size:13px} td:last-child,th:last-child{text-align:right} .finalTitle{font-size:44px;font-weight:900;margin:0 0 16px}
@media(max-width:800px){body{padding:10px}.grid{grid-template-columns:1fr}.voteRow{grid-template-columns:145px 1fr 42px}.samples{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand">🎬📺 CATA DE PANTALLA</div><div class="badge">Profesor · Firebase</div></div>
<section class="card hero center" id="setup"><div class="muted">CINE + ANUNCIOS · 10 MUESTRAS</div><h1>¿Cuál gana?</h1><button id="createBtn">Crear votación</button><div id="setupStatus" class="muted" style="margin-top:10px"></div></section>
<section class="card hero center hidden" id="lobby"><div class="muted">CÓDIGO</div><div class="code" id="roomCode">------</div><div class="link" id="joinLink"></div><div class="actions"><button class="secondary" id="copyBtn">Copiar enlace</button><button id="startBtn" disabled>Empezar</button></div><div class="players" id="players"></div><div class="muted" id="playerCount"></div></section>
<section class="hidden" id="game">
<div class="grid">
<main class="card center">
<div class="sampleNo" id="kindLabel">AHORA VOTAMOS</div><div class="sampleBig" id="sampleBig">#1</div><div class="status" id="voteStatus"></div>
<div class="voteCards">
<div class="voteRow"><div class="voteName" id="name4"></div><div class="bar"><div class="fill" id="bar4"></div></div><div class="count" id="count4">0</div></div>
<div class="voteRow"><div class="voteName" id="name3"></div><div class="bar"><div class="fill" id="bar3"></div></div><div class="count" id="count3">0</div></div>
<div class="voteRow"><div class="voteName" id="name2"></div><div class="bar"><div class="fill" id="bar2"></div></div><div class="count" id="count2">0</div></div>
<div class="voteRow"><div class="voteName" id="name1"></div><div class="bar"><div class="fill" id="bar1"></div></div><div class="count" id="count1">0</div></div>
</div>
<div class="muted" id="responseCount"></div><div class="info hidden" id="itemInfo"></div>
<div class="actions" style="margin-top:18px"><button class="pink" id="revealBtn">👁 Mostrar</button><button class="secondary" id="closeBtn">Cerrar votación</button><button class="green" id="nextBtn">Siguiente →</button></div>
</main>
<aside class="card"><div class="samples" id="samples"></div><h3>Ranking</h3><table><tbody id="ranking"></tbody></table></aside>
</div></section>
<section class="card center hidden" id="final"><div class="finalTitle">🏆 Resultado final</div><table><thead><tr><th>#</th><th>Muestra</th><th>Votos</th><th>Media</th></tr></thead><tbody id="finalTable"></tbody></table><div class="actions" style="margin-top:18px"><button id="newBtn">Nueva votación</button></div></section>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import { getDatabase, ref, get, set, update, onValue, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';
import { firebaseConfig } from './firebase-config.js';
const ITEMS=[{"n": 1, "type": "película", "icon": "🎬", "videoId": "CzJM3jYKjAg", "start": 28, "end": 68, "title": "Relatos salvajes", "creator": "Damián Szifron", "country": "🇦🇷 Argentina / 🇪🇸 España", "meta": "2014 · comedia negra / drama", "note": "Seis historias sobre personas que pierden el control. Humor negro, tensión y situaciones cotidianas llevadas al extremo."}, {"n": 2, "type": "anuncio", "icon": "📺", "videoId": "EpYnBzIoWHQ", "start": 25, "end": 70, "title": "Justino", "creator": "Lotería de Navidad", "country": "🇪🇸 España", "meta": "2015 · animación / Navidad", "note": "Un vigilante nocturno de una fábrica de maniquíes intenta conectar con compañeros a los que nunca ve."}, {"n": 3, "type": "película", "icon": "🎬", "videoId": "XKM6LZGZVtI", "start": 22, "end": 62, "title": "La sociedad de la nieve", "creator": "J. A. Bayona", "country": "🇪🇸 España / 🇺🇾 Uruguay", "meta": "2023 · supervivencia / drama", "note": "La historia del vuelo 571 y de los supervivientes de los Andes, contada desde la experiencia del grupo."}, {"n": 4, "type": "anuncio", "icon": "📺", "videoId": "grTQHDlcI2w", "start": 0, "end": 45, "title": "Familiarizados", "creator": "IKEA España", "country": "🇪🇸 España", "meta": "2018 · campaña de Navidad", "note": "Familias reales responden preguntas sobre redes, famosos y, después, sobre las personas de su propia familia."}, {"n": 5, "type": "película", "icon": "🎬", "videoId": "ngl5wCDw840", "start": 14, "end": 54, "title": "Ya no estoy aquí", "creator": "Fernando Frías", "country": "🇲🇽 México", "meta": "2019 · drama / cultura urbana", "note": "Ulises, un joven de Monterrey vinculado a la cultura de la cumbia rebajada, se ve obligado a abandonar su entorno."}, {"n": 6, "type": "anuncio", "icon": "📺", "videoId": "SMzzk8A1fXQ", "start": 0, "end": 45, "title": "Hazte extranjero", "creator": "Campofrío", "country": "🇪🇸 España", "meta": "2013 · humor / identidad", "note": "Una campaña que juega con la idea de cambiar de nacionalidad para hablar, con humor, de costumbres e identidad españolas."}, {"n": 7, "type": "película", "icon": "🎬", "videoId": "4GMO3BgUIOk", "start": 18, "end": 58, "title": "Dolor y gloria", "creator": "Pedro Almodóvar", "country": "🇪🇸 España", "meta": "2019 · drama", "note": "Un director de cine revisita recuerdos, relaciones y momentos decisivos de su vida mientras atraviesa una crisis creativa."}, {"n": 8, "type": "anuncio", "icon": "📺", "videoId": "4FADaGZ6QEw", "start": 0, "end": 45, "title": "Para todos", "creator": "Coca-Cola Argentina", "country": "🇦🇷 Argentina", "meta": "2002 · publicidad", "note": "Una voz enumera tipos de personas mientras las formas del envase ilustran cada contraste. Una campaña construida casi solo con lenguaje e imagen."}, {"n": 9, "type": "película", "icon": "🎬", "videoId": "hKa8U-8vsfU", "start": 20, "end": 60, "title": "El secreto de sus ojos", "creator": "Juan José Campanella", "country": "🇦🇷 Argentina / 🇪🇸 España", "meta": "2009 · thriller / drama", "note": "Un antiguo empleado judicial vuelve a un caso de asesinato que lo marcó durante décadas."}, {"n": 10, "type": "anuncio", "icon": "📺", "videoId": "DNDUX5Q19tU", "start": 0, "end": 35, "title": "La llama que llama", "creator": "Telecom Argentina", "country": "🇦🇷 Argentina", "meta": "1998–2001 · humor", "note": "Una familia de llamas hace bromas por teléfono. La campaña juega con el doble sentido de 'llama' y 'llamar'."}];
const $=s=>document.querySelector(s);
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
let user=null,code=null,participants={},votes={},current=0,state={status:'lobby'},revealed=false;
const labels={película:{4:'🍿 La vería hoy',3:'🙂 La vería',2:'🤔 Tal vez',1:'🙅 No la vería'},anuncio:{4:'🎯 Me convence',3:'👍 Funciona',2:'🤔 No sé',1:'🙅 No funciona'}};
signInAnonymously(auth).catch(e=>$('#setupStatus').textContent='Firebase: '+e.message);
onAuthStateChanged(auth,u=>{user=u;$('#createBtn').disabled=!u});
$('#createBtn').onclick=createRoom;$('#startBtn').onclick=()=>openItem(0);$('#copyBtn').onclick=copyLink;$('#revealBtn').onclick=toggleReveal;$('#closeBtn').onclick=closeVoting;$('#nextBtn').onclick=nextItem;$('#newBtn').onclick=()=>location.reload();
function rr(path=''){return ref(db,`musicVotes/${code}${path?'/'+path:''}`)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function createRoom(){
 if(!user)return;$('#createBtn').disabled=true;$('#setupStatus').textContent='Creando…';
 try{let tries=0;do{code=String(Math.floor(100000+Math.random()*900000));if(!(await get(ref(db,`musicVotes/${code}/hostUid`))).exists())break;tries++}while(tries<15);
 if(tries>=15)throw Error('No he podido crear un código.');
 await set(rr(),{hostUid:user.uid,kind:'cata_cine_anuncios_b1_votes',createdAt:serverTimestamp(),state:{status:'lobby',current:0,open:false,revealed:false}});
 subscribe();$('#setup').classList.add('hidden');$('#lobby').classList.remove('hidden');$('#roomCode').textContent=code;
 const u=new URL('vota_cine_anuncios_alumno.html',location.href);u.searchParams.set('room',code);$('#joinLink').textContent=u.href;
 }catch(e){$('#setupStatus').textContent=e.message;$('#createBtn').disabled=false}
}
function subscribe(){
 onValue(rr('participants'),s=>{participants=s.val()||{};renderPlayers();renderCurrent()});
 onValue(rr('votes'),s=>{votes=s.val()||{};renderCurrent();renderRanking()});
 onValue(rr('state'),s=>{state=s.val()||{};current=Number(state.current||0);revealed=!!state.revealed;if(state.status==='playing')showGame();if(state.status==='finished')showFinal()});
}
function renderPlayers(){const a=Object.values(participants);$('#players').innerHTML=a.map(p=>`<span class="player">${esc(p.nick)}</span>`).join('');$('#playerCount').textContent=`${a.length} ${a.length===1?'persona conectada':'personas conectadas'}`;$('#startBtn').disabled=a.length<1}
function showGame(){$('#lobby').classList.add('hidden');$('#game').classList.remove('hidden');renderButtons();renderCurrent();renderRanking()}
async function openItem(i){current=i;revealed=false;await update(rr('state'),{status:'playing',current:i,open:true,revealed:false})}
async function nextItem(){if(current>=ITEMS.length-1){await finish();return}await openItem(current+1)}
async function closeVoting(){await update(rr('state'),{open:false})}
async function toggleReveal(){revealed=!revealed;await update(rr('state'),{revealed})}
function renderButtons(){$('#samples').innerHTML=ITEMS.map((x,i)=>`<button class="sbtn ${i===current?'active':''}" data-i="${i}">${x.icon} #${i+1}</button>`).join('');document.querySelectorAll('.sbtn').forEach(b=>b.onclick=()=>openItem(Number(b.dataset.i)))}
function roundVotes(i){const obj=votes[i]||{};return Object.values(obj).filter(v=>v&&Number(v.value)>=1&&Number(v.value)<=4)}
function renderCurrent(){
 if(state.status!=='playing')return;const x=ITEMS[current],lab=labels[x.type];$('#sampleBig').textContent=`${x.icon} #${current+1}`;$('#kindLabel').textContent=x.type.toUpperCase();renderButtons();
 [4,3,2,1].forEach(v=>$('#name'+v).textContent=lab[v]);const arr=roundVotes(current),total=arr.length,max=Math.max(1,...[1,2,3,4].map(v=>arr.filter(q=>Number(q.value)===v).length));
 [4,3,2,1].forEach(v=>{const n=arr.filter(q=>Number(q.value)===v).length;$('#count'+v).textContent=n;$('#bar'+v).style.width=`${n/max*100}%`});
 $('#responseCount').textContent=`${total}/${Object.keys(participants).length} votos`;$('#voteStatus').textContent=state.open?'🟢 Votación abierta':'🔒 Votación cerrada';$('#closeBtn').disabled=!state.open;
 $('#itemInfo').innerHTML=`<strong>${esc(x.title)}</strong><br>${esc(x.creator)}<br><span class="muted">${esc(x.country)} · ${esc(x.meta)}</span>`;$('#itemInfo').classList.toggle('hidden',!revealed);
 $('#revealBtn').textContent=revealed?'🙈 Ocultar':'👁 Mostrar';$('#nextBtn').textContent=current===ITEMS.length-1?'Ver ranking final 🏆':'Siguiente →';
}
function stats(){return ITEMS.map((x,i)=>{const a=roundVotes(i),sum=a.reduce((s,v)=>s+Number(v.value),0);return{i,x,count:a.length,avg:a.length?sum/a.length:0}})}
function renderRanking(){const a=stats().filter(x=>x.count).sort((a,b)=>b.avg-a.avg||b.count-a.count);$('#ranking').innerHTML=a.map((x,j)=>`<tr><td>${j+1}</td><td>${x.x.icon} #${x.i+1}</td><td><strong>${x.avg.toFixed(2)}</strong></td></tr>`).join('')}
async function finish(){await update(rr('state'),{status:'finished',open:false,revealed:false});showFinal()}
function showFinal(){$('#game').classList.add('hidden');$('#lobby').classList.add('hidden');$('#final').classList.remove('hidden');const a=stats().filter(x=>x.count).sort((a,b)=>b.avg-a.avg||b.count-a.count);$('#finalTable').innerHTML=a.map((x,j)=>`<tr><td>${j+1}</td><td><strong>${x.x.icon} ${esc(x.x.title)}</strong><br><span class="muted">${esc(x.x.creator)}</span></td><td>${x.count}</td><td><strong>${x.avg.toFixed(2)}</strong></td></tr>`).join('')}
async function copyLink(){try{await navigator.clipboard.writeText($('#joinLink').textContent);$('#copyBtn').textContent='✓ Copiado';setTimeout(()=>$('#copyBtn').textContent='Copiar enlace',1200)}catch{}}
</script>
</body></html>
