<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡VOTA! — A1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  font-family:Poppins,sans-serif;color:#172033;
  background:
    radial-gradient(circle at 15% 15%,rgba(255,255,255,.28),transparent 28%),
    linear-gradient(135deg,#667eea,#764ba2);
}
.wrap{width:min(850px,100%)}
.card{
  background:rgba(255,255,255,.97);border-radius:28px;padding:38px;
  box-shadow:0 24px 70px rgba(20,20,55,.3);text-align:center;
}
.badge{
  display:inline-block;padding:7px 13px;border-radius:999px;
  background:#eef0ff;color:#5264d6;font-size:13px;font-weight:800;margin-bottom:14px;
}
h1{font-size:clamp(32px,6vw,54px);margin:0 0 8px}
p{color:#697080;line-height:1.6;margin:0 auto 28px;max-width:610px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.link{
  display:flex;min-height:180px;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;text-decoration:none;border-radius:22px;padding:24px;color:white;
  transition:.18s transform,.18s box-shadow;
}
.link:hover{transform:translateY(-5px);box-shadow:0 18px 35px rgba(30,30,70,.23)}
.teacher{background:linear-gradient(135deg,#5264d6,#7656c8)}
.student{background:linear-gradient(135deg,#3a9d7d,#48b89a)}
.icon{font-size:44px}
.title{font-size:23px;font-weight:800}
.small{font-size:13px;opacity:.86}
.footer{margin-top:24px;font-size:12px;color:#8a8f9d}
@media(max-width:620px){
  .card{padding:26px 18px}.grid{grid-template-columns:1fr}.link{min-height:145px}
}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <span class="badge">Español A1 · Firebase</span>
    <h1>🗳️ ¡VOTA!</h1>
    <p>Me gusta / No me gusta — wybierz, dokąd chcesz wejść. Nie musisz już pamiętać ani ręcznie wpisywać nazw plików.</p>

    <div class="grid">
      <a class="link teacher" href="profesor.html">
        <span class="icon">👩‍🏫</span>
        <span class="title">Panel nauczyciela</span>
        <span class="small">Utwórz klasę i prowadź głosowanie →</span>
      </a>

      <a class="link student" href="alumno.html">
        <span class="icon">📱</span>
        <span class="title">Ekran ucznia</span>
        <span class="small">Dołącz do klasy →</span>
      </a>
    </div>

    <div class="footer">vota-a1 · GitHub Pages</div>
  </section>
</main>
</body>
</html>
