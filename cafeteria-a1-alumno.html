<body><div class="wrap">
<section id="join" class="card"><span class="badge">A1 · Cafetería</span><h1 style="margin-top:10px">☕ Entra en la cafetería</h1><label>Código</label><input id="roomInput" inputmode="numeric" maxlength="6" placeholder="123456"><label>Tu nombre</label><input id="nickInput" maxlength="22" placeholder="Marta"><div class="actions"><button id="joinBtn" class="green">Entrar</button></div><div id="joinStatus" class="muted" style="margin-top:9px"></div></section>
<section id="waiting" class="card hidden done"><div style="font-size:65px;animation:idleBob 2s ease-in-out infinite">🍽️</div><h2 id="waitNick"></h2><p class="muted">Esperando al profesor y a tu pareja…</p></section>
<section id="game" class="hidden">
  <section class="card">
    <div class="roleCard"><div><div id="roundLabel" class="muted">RONDA 1</div><div id="roleName" class="roleName">—</div><div id="partnerName" class="muted"></div></div><div id="timer" class="timer"><small>TIEMPO</small>05:00</div></div>
    <div id="progressRail" class="progressRail"></div><div id="stageCaption" class="stageCaption"></div>
    <div id="scene" class="scene entering"><div class="window"><div class="city"></div></div><div class="cafeSign">CAFETERÍA</div><div class="menuBoard"><b>MENÚ</b><br>☕ café · 🍵 té<br>🥐 croissant · 🍰 tarta</div><div class="counter"></div><div class="machine"></div><div class="machineSteam">♨️</div><div class="displayCase"></div><div class="door"></div><div class="plant">🪴</div><div class="tableSpot" data-table="1"></div><div class="tableSpot" data-table="2"></div><div class="tableSpot" data-table="3"></div><div class="tableSpot" data-table="4"></div><div id="waiterAvatar" class="avatar waiter">🧑‍🍳</div><div id="clientAvatar" class="avatar client walking">🧑</div><div id="waiterBubble" class="bubble waiterBubble"></div><div id="clientBubble" class="bubble clientBubble"></div><div id="sceneTray" class="tray">☕</div><div class="receiptScene">🧾</div><div id="sceneLabel" class="sceneLabel">ENTRADA</div><div id="scenePayment" class="scenePayment"></div><div id="sceneOrder" class="sceneOrder"></div></div>
  </section>
  <section id="task" class="card"></section>

</div>
<script type="module">

import { firebaseConfig } from './firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=s=>document.querySelector(s);
let user=null,code=null,nick='',room=null,serverOffset=0,mission=null,selected=null,lastRenderKey='',pairId=null,missionSubKey='';
const STAGE_NAMES=['Entrada','Bebidas','Algo para comer','Confirmación','Pago','Preparación','Petición extra','Despedida'];
const DRINKS={solo:{label:'Café solo',price:2,emoji:'☕'},cortado:{label:'Café cortado',price:2.2,emoji:'☕'},leche:{label:'Café con leche',price:2.6,emoji:'🥛'},capuccino:{label:'Capuchino',price:3.2,emoji:'☕'},frio:{label:'Café frío',price:3.4,emoji:'🧋'},te:{label:'Té',price:2.4,emoji:'🍵'},chocolate:{label:'Chocolate caliente',price:3.2,emoji:'🍫'},zumo:{label:'Zumo de naranja',price:3,emoji:'🍊'},agua:{label:'Agua',price:2,emoji:'💧'},infusion:{label:'Infusión',price:2.5,emoji:'🌿'}};
const FOODS={croissant:{label:'Croissant',price:2.5,emoji:'🥐'},tostada:{label:'Tostada con tomate',price:3.5,emoji:'🍅'},aguacate:{label:'Tostada con aguacate',price:5,emoji:'🥑'},bocadillo:{label:'Bocadillo',price:5.5,emoji:'🥖'},tortilla:{label:'Pincho de tortilla',price:4.5,emoji:'🥔'},tarta:{label:'Tarta',price:4,emoji:'🍰'},galleta:{label:'Galleta',price:2.2,emoji:'🍪'},yogur:{label:'Yogur con fruta',price:4.5,emoji:'🥣'},fruta:{label:'Fruta',price:3.5,emoji:'🍓'},sandwich:{label:'Sándwich vegetal',price:5.5,emoji:'🥪'}};
const ITEMS=[['azucar','🧂','azúcar'],['edulcorante','✨','edulcorante'],['cucharilla','🥄','cucharilla'],['servilleta','🧻','servilleta'],['agua','💧','vaso de agua'],['leche','🥛','un poco de leche'],['pajita','🥤','pajita']];

 '0_waiter':['Saluda y pregunta si es para tomar aquí o para llevar.','Hola. ¿Para tomar aquí o para llevar?'],
 '0_client':['Elige una opción y responde con una frase corta.','Para tomar aquí, por favor.'],
 '1_waiter':['Pregunta qué quiere beber.','¿Qué quieres tomar?'],
 '1_client':['Puedes elegir una o varias bebidas.','Un café con leche y un agua, por favor.'],
 '2_waiter':['Pregunta si quiere algo para comer.','¿Quieres algo para comer?'],
 '2_client':['Puedes elegir una o varias cosas.','Sí, una tostada con tomate y un yogur, por favor.'],
 '3_waiter':['Repite brevemente todo el pedido.','Entonces, un café con leche, un agua y una tostada.'],

 '4_waiter':['Pregunta cómo quiere pagar.','¿Tarjeta o efectivo?'],

 '6_waiter':['Elige lo que ha pedido, repítelo y responde.','Sí, claro. Una cucharilla. Ahora te la doy.'],
 '7_waiter':['Despídete con una frase corta.','Gracias. Hasta luego.'],
 '7_client':['Responde con una despedida corta.','Gracias. Adiós.']
};
const params=new URLSearchParams(location.search);if(params.get('room'))$('#roomInput').value=params.get('room').replace(/\D/g,'').slice(0,6);$('#nickInput').value=localStorage.getItem('cafeteria_a1_nick')||'';

function cycleNo(){return Number(pairState()?.cycle||1)}
function myRole(){const p=pairState();return p?.waiterUid===user?.uid?'waiter':p?.clientUid===user?.uid?'client':null}
function partnerUid(){const p=pairState(),r=myRole();return r==='waiter'?p?.clientUid:r==='client'?p?.waiterUid:null}
function basePairData(){return pairId?room?.rounds?.[room.state?.round]?.pairs?.[pairId]||{}:{}}
function roundPair(){const base=basePairData(),c=cycleNo();return base?.cycles?.[c]||(c===1?base:{})}
function tRef(stage){return ref(db,`roleplays/${code}/rounds/${room.state.round}/pairs/${pairId}/cycles/${cycleNo()}/turns/${stage}/${user.uid}`)}

function currentSpeech(){

function hideBubbles(){for(const id of ['#waiterBubble','#clientBubble']){const el=$(id);if(el){el.textContent='';el.classList.remove('show')}}}
function anchorBubble(bubble,avatar){

    const scene=$('#scene');if(!scene)return;
    const sr=scene.getBoundingClientRect(),ar=avatar.getBoundingClientRect(),bw=bubble.offsetWidth||120,bh=bubble.offsetHeight||45;

    let top=(ar.top-sr.top)-bh-16;
    if(top<8)top=Math.min(scene.clientHeight-bh-8,(ar.bottom-sr.top)+10);
    bubble.style.left=left+'px';bubble.style.top=top+'px';bubble.style.right='auto';bubble.style.bottom='auto';
  });
}

function renderFinishedCycle(box){const c=cycleNo();if(c>=2){box.innerHTML='<div class="done"><div style="font-size:70px">🏁</div><h2>¡Actividad completada!</h2><p>Has practicado los dos roles de la cafetería. Puedes esperar a las otras parejas.</p></div>';return}const ready=pairState()?.swapReady||{},mine=ready[user.uid]===true,other=ready[partnerUid()]===true;box.innerHTML=`<div class="swapCard done"><div style="font-size:62px">🎉</div><h2>¡Primera vuelta terminada!</h2><p>No tienes que esperar a las otras mesas. Cuando los dos estéis listos, podéis cambiar los roles.</p><div class="readyPeople"><span class="readyChip ${mine?'yes':''}">${mine?'✓':'○'} Tú</span><span class="readyChip ${other?'yes':''}">${other?'✓':'○'} ${esc(room.participants?.[partnerUid()]?.nick||'Compañero/a')}</span></div>${mine?'<button class="secondary" disabled>✓ Listo/a para cambiar</button>':'<button id="studentSwapBtn">🔄 Estoy listo/a para cambiar de rol</button>'}<p class="muted" style="margin-top:10px">El cambio empieza cuando los dos pulsáis el botón.</p></div>`;const b=$('#studentSwapBtn');if(b)b.onclick=async()=>{b.disabled=true;await set(ref(db,`roleplays/${code}/pairs/${pairId}/swapReady/${user.uid}`),true)}}
function bindText(stage,key){const btn=$('#sendBtn'),ta=$('#textInput');if(!btn||!ta)return;btn.onclick=async()=>{const text=ta.value.trim();if(!text)return;btn.disabled=true;await update(tRef(stage),{[key]:text,at:nowServer()})}}
function bindMultiChoice(stage,choiceKey,textKey,items,label='elemento'){selected=[];document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const key=b.dataset.choice; selected=selected.includes(key)?selected.filter(x=>x!==key):[...selected,key]; document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',selected.includes(x.dataset.choice))); const sum=$('#choiceSummary'); if(sum){ const names=selected.map(k=>items[k]?.label).filter(Boolean); const emojis=selected.map(k=>items[k]?.emoji).filter(Boolean).join(' '); sum.innerHTML=names.length?`<div class="choiceSummary"><span class="big">${emojis||'✅'}</span><div><b>Tu elección: ${esc(formatNatural(names))}</b><div class="muted">Ahora escríbelo al barista.</div></div></div>`:'' } $('#sendBtn').disabled=selected.length===0}); $('#sendBtn').onclick=async()=>{const text=$('#textInput').value.trim(); if(!selected.length||!text)return; $('#sendBtn').disabled=true; await update(tRef(stage),{[choiceKey]:selected,[textKey]:text,at:nowServer()})}}
function bindTableChoice(stage){document.querySelectorAll('[data-table-choice]').forEach(b=>b.onclick=()=>{selected=b.dataset.tableChoice;document.querySelectorAll('[data-table-choice]').forEach(x=>x.classList.toggle('selected',x===b));$('#sendBtn').disabled=false});$('#sendBtn').onclick=async()=>{const text=$('#textInput').value.trim();if(!selected||!text)return;$('#sendBtn').disabled=true;await update(tRef(stage),{tableNo:Number(selected),seatText:text,at:nowServer()})}}
function bindServiceMode(stage){selected=null;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{selected=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('selected',x===b));$('#sendBtn').disabled=false});$('#sendBtn').onclick=async()=>{const text=$('#textInput').value.trim();if(!selected||!text)return;$('#sendBtn').disabled=true;await update(tRef(stage),{serviceMode:selected,text,at:nowServer()})}}
function bindPayment(stage){document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{selected=b.dataset.pay;document.querySelectorAll('[data-pay]').forEach(x=>x.classList.toggle('selected',x===b));$('#sendBtn').disabled=false});$('#sendBtn').onclick=async()=>{const text=$('#textInput').value.trim();if(!selected||!text)return;$('#sendBtn').disabled=true;await update(tRef(stage),{paymentMethod:selected,paymentText:text,at:nowServer()})}}
function bindMissionWaiter(stage){document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{selected=b.dataset.item;document.querySelectorAll('[data-item]').forEach(x=>x.classList.toggle('selected',x===b));$('#sendBtn').disabled=false;$('#wrong').classList.add('hidden')});$('#sendBtn').onclick=async()=>{const text=$('#textInput').value.trim();if(!selected||!text)return;$('#sendBtn').disabled=true;await update(tRef(stage),{selectedItem:selected,replyText:text,at:nowServer()})}}
function buildBill(){const o=roundPair()?.order||{},drinks=arrayify(o.drinkKeys||o.drinkKey),foods=arrayify(o.foodKeys||o.foodKey);let rows='',total=0;for(const k of drinks){const d=DRINKS[k];if(!d)continue;total+=Number(d.price||0);rows+=`<div class="billRow"><span>${esc(d.label)}</span><span>${d.price.toFixed(2).replace('.',',')} €</span></div>`}for(const k of foods){const f=FOODS[k];if(!f)continue;total+=Number(f.price||0);rows+=`<div class="billRow"><span>${esc(f.label)}</span><span>${f.price.toFixed(2).replace('.',',')} €</span></div>`}return `<div class="bill"><b>LA CUENTA</b>${rows}<div class="billRow total"><span>TOTAL</span><span>${total.toFixed(2).replace('.',',')} €</span></div></div>`}
setInterval(()=>{if(!room||room.state?.status!=='playing'||!pairId)return;const end=Number(pairState()?.cycleEndsAt||room.state?.roundEndsAt||0);const left=Math.max(0,end-nowServer()),m=Math.floor(left/60000),s=Math.floor((left%60000)/1000);$('#timer').innerHTML=`<small>TIEMPO · VUELTA ${cycleNo()}/2</small>${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`},250);
</script></body></html>
