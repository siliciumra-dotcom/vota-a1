<body><div class="wrap">

 if(!user){$('#joinStatus').textContent='Todavía conectando…';return}const c=$('#roomInput').value.replace(/\D/g,'').slice(0,6),n=$('#nickInput').value.trim().replace(/\s+/g,' ').slice(0,22);if(c.length!==6){$('#joinStatus').textContent='Escribe 6 números.';return}if(n.length<2){$('#joinStatus').textContent='Escribe tu nombre.';return}$('#joinBtn').disabled=true;

function bindMissionWaiter(stage){document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{selected=b.dataset.item;document.querySelectorAll('[data-item]').forEach(x=>x.classList.toggle('selected',x===b));$('#sendBtn').disabled=false;$('#wrong').classList.add('hidden')});$('#sendBtn').onclick=async()=>{const text=$('#textInput').value.trim();if(!selected||!text)return;$('#sendBtn').disabled=true;await set(tRef(stage),{selectedItem:selected,replyText:text,at:nowServer()})}}
function buildBill(){const o=roundPair()?.order||{},drinks=arrayify(o.drinkKeys||o.drinkKey),foods=arrayify(o.foodKeys||o.foodKey);let rows='',total=0;for(const k of drinks){const d=DRINKS[k];if(!d)continue;total+=Number(d.price||0);rows+=`<div class="billRow"><span>${esc(d.label)}</span><span>${d.price.toFixed(2).replace('.',',')} €</span></div>`}for(const k of foods){const f=FOODS[k];if(!f)continue;total+=Number(f.price||0);rows+=`<div class="billRow"><span>${esc(f.label)}</span><span>${f.price.toFixed(2).replace('.',',')} €</span></div>`}return `<div class="bill"><b>LA CUENTA</b>${rows}<div class="billRow total"><span>TOTAL</span><span>${total.toFixed(2).replace('.',',')} €</span></div></div>`}
setInterval(()=>{if(!room||room.state?.status!=='playing'||!pairId)return;const end=Number(pairState()?.cycleEndsAt||room.state?.roundEndsAt||0);const left=Math.max(0,end-nowServer()),m=Math.floor(left/60000),s=Math.floor((left%60000)/1000);$('#timer').innerHTML=`<small>TIEMPO · VUELTA ${cycleNo()}/2</small>${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`},250);
</script></body></html>
