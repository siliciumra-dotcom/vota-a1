<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Restaurante A1</title>
<style>
:root{--bg:#f7f3ea;--ink:#1f2937;--muted:#6b7280;--card:#fff;--line:#e7dfd0;--accent:#a84b35;--green:#2f7d5b;--gold:#d89b3c}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#fffaf2,var(--bg));color:var(--ink)}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 12px 34px rgba(68,52,31,.08);margin-top:14px}.hidden{display:none!important}h1,h2,h3{margin-top:0}.muted{font-size:13px;color:var(--muted)}
input,textarea{width:100%;border:1.5px solid #d9d1c5;border-radius:14px;padding:13px 14px;font:inherit;outline:none;background:#fff}textarea{min-height:88px;resize:vertical}input:focus,textarea:focus{border-color:#c17a62;box-shadow:0 0 0 3px #f5e2dc}label{display:block;font-weight:800;margin:10px 0 6px}button{border:0;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer;background:var(--accent);color:#fff;font-size:15px}button.green{background:var(--green)}button.secondary{background:#ece7df;color:#41382d}button:disabled{opacity:.45}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#efe3d0;color:#6c4f2a;font-size:12px;font-weight:900}.roleCard{display:flex;justify-content:space-between;gap:12px;align-items:center}.roleName{font-size:25px;font-weight:950}.timer{font-size:27px;font-weight:950;color:var(--accent);font-variant-numeric:tabular-nums}.instruction{padding:15px;border-radius:16px;background:#fff5df;border:1px solid #ead1a3;font-weight:800;line-height:1.45}.partnerMsg{margin-top:12px;padding:13px;border-radius:14px;background:#f2f5f7;border-left:5px solid #8da4b1}.hint{margin-top:9px;padding:10px 12px;border-radius:12px;background:#eef7f1;color:#2d684c;font-size:13px}.wrong{margin-top:9px;padding:10px 12px;border-radius:12px;background:#fff0ed;color:#983d2f;font-size:13px;font-weight:800}.menu,.checklist{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.menu button,.checklist button{background:#fff;color:#342d27;border:1.5px solid var(--line);min-height:70px}.menu button.selected,.checklist button.selected{border-color:var(--green);box-shadow:0 0 0 3px #dcefe5}.done{text-align:center;padding:20px}.bill{background:#fffdf7;border:1px dashed #b9a78e;border-radius:14px;padding:14px;margin:12px 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.billRow{display:flex;justify-content:space-between;padding:5px 0}.total{font-weight:900;border-top:1px dashed #aaa;margin-top:5px;padding-top:9px}
.scene{height:145px;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(#f4d5ae 0 62%,#caa67b 62%);margin:12px 0}.table{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);width:120px;height:14px;background:#77492d;border-radius:7px}.avatar{position:absolute;bottom:47px;font-size:42px;transition:.4s}.waiter{left:15%}.client{right:15%}.plate{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);font-size:29px;opacity:0}.scene.serving .plate,.scene.bill .plate{opacity:1}.scene.mission .waiter{transform:translateX(40px)}
@media(max-width:520px){.menu,.checklist{grid-template-columns:1fr}.roleCard{align-items:flex-start}.roleName{font-size:21px}}
</style>
</head>
<body><div class="wrap">
<section id="join" class="card"><span class="badge">A1 · Restaurante</span><h1 style="margin-top:10px">🍽️ Entra en la partida</h1><label>Código</label><input id="roomInput" inputmode="numeric" maxlength="6" placeholder="123456"><label>Tu nombre</label><input id="nickInput" maxlength="22" placeholder="Marta"><div class="actions"><button id="joinBtn" class="green">Entrar</button></div><div id="joinStatus" class="muted" style="margin-top:9px"></div></section>
<section id="waiting" class="card hidden done"><div style="font-size:65px">🍽️</div><h2 id="waitNick"></h2><p class="muted">Esperando al profesor y a tu pareja…</p></section>
<section id="game" class="hidden"><section class="card"><div class="roleCard"><div><div id="roundLabel" class="muted">RONDA 1</div><div id="roleName" class="roleName">—</div><div id="partnerName" class="muted"></div></div><div id="timer" class="timer">05:00</div></div><div id="scene" class="scene"><div class="table"></div><div class="avatar waiter">🧑‍🍳</div><div class="avatar client">🧑</div><div class="plate">🍽️</div></div></section><section id="task" class="card"></section></section>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';
import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
import { getDatabase, ref, get, set, onValue, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js';
import { firebaseConfig } from './firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=s=>document.querySelector(s);
let user=null,code=null,nick='',room=null,serverOffset=0,mission=null,selected=null,lastRenderKey='',pairId=null,missionSubKey='';
const DRINKS={agua:{label:'Agua',price:2,emoji:'💧'},cola:{label:'Coca-Cola',price:2.5,emoji:'🥤'},zumo:{label:'Zumo de naranja',price:3,emoji:'🍊'},cafe:{label:'Café',price:2,emoji:'☕'}};
const FOODS={pizza:{label:'Pizza margarita',price:10,emoji:'🍕'},ensalada:{label:'Ensalada',price:9,emoji:'🥗'},pasta:{label:'Pasta',price:11,emoji:'🍝'},hamburguesa:{label:'Hamburguesa',price:12,emoji:'🍔'},paella:{label:'Paella',price:14,emoji:'🥘'}};
const ITEMS=[['servilleta','🧻','servilleta'],['tenedor','🍴','tenedor'],['cuchillo','🔪','cuchillo'],['cuchara','🥄','cuchara'],['pan','🥖','pan'],['agua','💧','agua'],['sal','🧂','sal']];
const params=new URLSearchParams(location.search);if(params.get('room'))$('#roomInput').value=params.get('room').replace(/\D/g,'').slice(0,6);$('#nickInput').value=localStorage.getItem('restaurante_a1_nick')||'';
onValue(ref(db,'.info/serverTimeOffset'),s=>serverOffset=Number(s.val()||0));signInAnonymously(auth).catch(e=>$('#joinStatus').textContent='Firebase: '+e.message);onAuthStateChanged(auth,u=>user=u);$('#joinBtn').onclick=join;
const nowServer=()=>Date.now()+serverOffset,esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pairState(){return pairId?room?.pairs?.[pairId]:null}function myRole(){const p=pairState();return p?.waiterUid===user?.uid?'waiter':p?.clientUid===user?.uid?'client':null}function partnerUid(){const p=pairState(),r=myRole();return r==='waiter'?p?.clientUid:r==='client'?p?.waiterUid:null}
function roundPair(){return pairId?room?.rounds?.[room.state?.round]?.pairs?.[pairId]||{}:{}}function tRef(stage){return ref(db,`roleplays/${code}/rounds/${room.state.round}/pairs/${pairId}/turns/${stage}/${user.uid}`)}
async function join(){
 if(!user){$('#joinStatus').textContent='Todavía conectando…';return}const c=$('#roomInput').value.replace(/\D/g,'').slice(0,6),n=$('#nickInput').value.trim().replace(/\s+/g,' ').slice(0,22);if(c.length!==6){$('#joinStatus').textContent='Escribe 6 números.';return}if(n.length<2){$('#joinStatus').textContent='Escribe tu nombre.';return}$('#joinBtn').disabled=true;
 try{const snap=await get(ref(db,`roleplays/${c}`)),r=snap.val();if(!r||!['roleplay_restaurante_a1_multi_2026','roleplay_restaurante_a1_2026'].includes(r.kind))throw Error('No encuentro esta partida.');const ps=r.participants||{},already=!!ps[user.uid];if(!already&&Object.keys(ps).length>=20)throw Error('La partida está llena.');if(r.state?.status!=='lobby'&&!already)throw Error('La partida ya ha empezado.');code=c;nick=n;localStorage.setItem('restaurante_a1_nick',nick);if(!already)await set(ref(db,`roleplays/${code}/participants/${user.uid}`),{nick,joinedAt:serverTimestamp()});$('#join').classList.add('hidden');$('#waiting').classList.remove('hidden');$('#waitNick').textContent=nick;subscribe();}
 catch(e){$('#joinStatus').textContent=e.message;$('#joinBtn').disabled=false}
}
function subscribe(){onValue(ref(db,`roleplays/${code}`),s=>{room=s.val()||null;const newPair=room?.pairingOf?.[user.uid]||null;if(newPair!==pairId){pairId=newPair;mission=null;lastRenderKey='';missionSubKey=''}render()})}
let missionUnsub=null;function subscribeMission(){const key=(pairId&&room?.state?.round)?`${room.state.round}/${pairId}`:'';if(!key||key===missionSubKey)return;if(missionUnsub)missionUnsub();mission=null;missionSubKey=key;missionUnsub=onValue(ref(db,`roleplayMissions/${code}/${room.state.round}/${pairId}/${user.uid}`),s=>{mission=s.val()||null;renderTask(true)})}
function render(){if(!room)return;const st=room.state||{};if(st.status==='lobby')return;if(st.status==='finished'){$('#waiting').classList.add('hidden');$('#game').classList.remove('hidden');$('#task').innerHTML='<div class="done"><div style="font-size:64px">👋</div><h2>Partida terminada</h2></div>';return}if(st.status!=='playing'||!pairId){return}subscribeMission();$('#waiting').classList.add('hidden');$('#game').classList.remove('hidden');const role=myRole(),p=pairState();if(!role||!p)return;$('#roundLabel').textContent='RONDA '+st.round+' · '+pairId.toUpperCase();$('#roleName').textContent=role==='waiter'?'🧑‍🍳 CAMARERO/A':'🧑 CLIENTE/A';$('#partnerName').textContent='Con: '+(room.participants?.[partnerUid()]?.nick||'—');const stage=Number(p.stage||0),sc=$('#scene');sc.className='scene '+(stage===3?'serving':stage===4?'mission':stage===5?'bill':'');renderTask()}
function partnerTurn(stage){return roundPair()?.turns?.[stage]?.[partnerUid()]||{}}function myTurn(stage){return roundPair()?.turns?.[stage]?.[user.uid]||{}}function partnerText(stage,keys){const t=partnerTurn(stage);for(const k of keys)if(t[k])return t[k];return ''}
function softHint(stage,role,text){const s=text.toLowerCase();if(text.trim().length<2)return 'Puedes escribir una frase muy corta.';if(stage===0&&role==='waiter'&&!/(cu[aá]nt|person|mesa|sois)/.test(s))return 'Puedes añadir: «¿Cuántas personas sois?»';if(stage===1&&role==='waiter'&&!/(tom|beb|quer)/.test(s))return 'Puedes preguntar: «¿Qué quieres tomar?»';if(stage===2&&role==='waiter'&&!/(com|quer)/.test(s))return 'Puedes preguntar: «¿Qué quieres comer?»';if(stage===4&&role==='client'&&!/(por favor|necesit|quier|pued|traer)/.test(s))return 'Puedes usar: «Perdona, ¿... por favor?»';if(stage===5&&role==='client'&&!/(cuenta|pagar)/.test(s))return 'Puedes decir: «La cuenta, por favor.»';return ''}
function formBox(instruction,partner='',placeholder='Escribe aquí…',button='Enviar'){return `<div class="instruction">${instruction}</div>${partner?`<div class="partnerMsg"><b>${esc(room.participants?.[partnerUid()]?.nick||'Tu compañero')}:</b> ${esc(partner)}</div>`:''}<label>Tu frase</label><textarea id="textInput" placeholder="${esc(placeholder)}"></textarea><div id="hint" class="hint hidden"></div><div class="actions"><button id="sendBtn">${button}</button></div>`}function alreadyDone(text='✓ Ya has enviado tu parte.'){return `<div class="done"><div style="font-size:54px">✅</div><h3>${text}</h3><p class="muted">Espera a tu compañero.</p></div>`}function waiting(text){return `<div class="done"><div style="font-size:52px">⏳</div><h3>${esc(text)}</h3></div>`}
function renderTask(force=false){if(!room||room.state?.status!=='playing'||!pairId)return;const stage=Number(pairState()?.stage||0),role=myRole(),key=`${room.state.round}|${pairId}|${stage}|${role}|${JSON.stringify(myTurn(stage))}|${JSON.stringify(partnerTurn(stage))}|${mission?.key||''}`;if(!force&&key===lastRenderKey)return;lastRenderKey=key;selected=null;const box=$('#task');
 if(stage>=7){box.innerHTML='<div class="done"><div style="font-size:68px">🎉</div><h2>¡Mesa completada!</h2><p>Habéis terminado. Esperad a las otras mesas y al profesor.</p></div>';return}const mine=myTurn(stage);
 if(stage===0){if(role==='waiter'){box.innerHTML=mine.text?alreadyDone():formBox('👋 Saluda. Pregunta para cuántas personas es la mesa.','','Ej.: Muy buenas…');if(!mine.text)bindText(stage,'text')}else{const msg=partnerText(stage,['text']);box.innerHTML=mine.text?alreadyDone():msg?formBox('👥 Responde cuántas personas sois.',msg,'Ej.: Somos dos.'):waiting('Espera el saludo del camarero.');if(msg&&!mine.text)bindText(stage,'text')}}
 if(stage===1){if(role==='waiter'){box.innerHTML=mine.askText?alreadyDone():formBox('🥤 Pregunta qué quiere tomar.','','Ej.: ¿Qué quieres tomar?');if(!mine.askText)bindText(stage,'askText')}else{const msg=partnerText(stage,['askText']);if(mine.clientText)box.innerHTML=alreadyDone();else if(!msg)box.innerHTML=waiting('Espera la pregunta del camarero.');else{box.innerHTML=`<div class="instruction">🥤 Elige una bebida y responde al camarero.</div><div class="partnerMsg"><b>${esc(room.participants?.[partnerUid()]?.nick||'Camarero')}:</b> ${esc(msg)}</div><div class="menu">${Object.entries(DRINKS).map(([k,v])=>`<button data-choice="${k}">${v.emoji} <b>${v.label}</b><br><span class="muted">${v.price.toFixed(2).replace('.',',')} €</span></button>`).join('')}</div><label>Tu frase</label><textarea id="textInput" placeholder="Ej.: Para mí, agua, por favor."></textarea><div class="actions"><button id="sendBtn" disabled>Enviar pedido</button></div>`;bindChoice(stage,'drinkKey','clientText')}}}
 if(stage===2){if(role==='waiter'){box.innerHTML=mine.askText?alreadyDone():formBox('🍽️ Pregunta qué quiere comer.','','Ej.: ¿Qué quieres comer?');if(!mine.askText)bindText(stage,'askText')}else{const msg=partnerText(stage,['askText']);if(mine.clientText)box.innerHTML=alreadyDone();else if(!msg)box.innerHTML=waiting('Espera la pregunta del camarero.');else{box.innerHTML=`<div class="instruction">🍽️ Elige un plato y responde.</div><div class="partnerMsg"><b>${esc(room.participants?.[partnerUid()]?.nick||'Camarero')}:</b> ${esc(msg)}</div><div class="menu">${Object.entries(FOODS).map(([k,v])=>`<button data-choice="${k}">${v.emoji} <b>${v.label}</b><br><span class="muted">${v.price.toFixed(2).replace('.',',')} €</span></button>`).join('')}</div><label>Tu frase</label><textarea id="textInput" placeholder="Ej.: Quiero la pizza, por favor."></textarea><div class="actions"><button id="sendBtn" disabled>Enviar pedido</button></div>`;bindChoice(stage,'foodKey','clientText')}}}
 if(stage===3){if(role==='waiter'){box.innerHTML=mine.serveText?alreadyDone('🍽️ Pedido servido.'):`<div class="instruction">🍽️ Lleva la comida a la mesa y di una frase corta.</div><label>Tu frase</label><textarea id="textInput" placeholder="Ej.: Aquí tienes."></textarea><div class="actions"><button id="sendBtn">Servir pedido</button></div>`;if(!mine.serveText)bindText(stage,'serveText')}else{const msg=partnerText(stage,['serveText']);box.innerHTML=mine.thanksText?alreadyDone():msg?formBox('🙏 Da las gracias.',msg,'Ej.: Muchas gracias.'):waiting('El camarero está trayendo el pedido…');if(msg&&!mine.thanksText)bindText(stage,'thanksText')}}
 if(stage===4){if(role==='client'){if(mine.text)box.innerHTML=alreadyDone('🕵️ Petición enviada.');else if(!mission)box.innerHTML=waiting('Preparando tu misión secreta…');else{box.innerHTML=`<div class="instruction">🕵️ MISIÓN SECRETA<br><span style="font-size:24px">${esc(mission.emoji)} Necesitas <b>${esc(mission.label)}</b>.</span><br><span class="muted">Pídeselo al camarero. No le enseñes esta tarjeta.</span></div><label>Tu frase</label><textarea id="textInput" placeholder="Ej.: Perdona, ¿una servilleta, por favor?"></textarea><div id="hint" class="hint hidden"></div><div class="actions"><button id="sendBtn">Pedir</button></div>`;bindText(stage,'text')}}else{const msg=partnerText(stage,['text']),fb=roundPair()?.feedback?.[4]?.[user.uid],wrong=fb?.kind==='wrong-item'&&fb?.selectedItem===mine.selectedItem;if(mine.replyText&&!wrong)box.innerHTML=alreadyDone('✅ Has respondido.');else if(!msg)box.innerHTML=waiting('Espera la petición del cliente.');else{box.innerHTML=`<div class="instruction">👂 Lee al cliente. Marca lo que ha pedido.</div><div class="partnerMsg"><b>${esc(room.participants?.[partnerUid()]?.nick||'Cliente')}:</b> ${esc(msg)}</div><div class="checklist">${ITEMS.map(([k,e,l])=>`<button data-item="${k}">${e} ${l}</button>`).join('')}</div><div id="wrong" class="wrong ${wrong?'':'hidden'}">No es eso. Mira otra vez el mensaje del cliente 👀</div><label>Responde al cliente</label><textarea id="textInput" placeholder="Ej.: Sí, claro. Ahora vengo."></textarea><div class="hint">💡 También vale: «Sí, claro.»</div><div class="actions"><button id="sendBtn" disabled>Confirmar y responder</button></div>`;bindMissionWaiter(stage)}}}
 if(stage===5){const bill=buildBill();if(role==='client'){box.innerHTML=mine.text?alreadyDone('🧾 Cuenta pedida.'):`<div class="instruction">🧾 Pide la cuenta.</div>${bill}<label>Tu frase</label><textarea id="textInput" placeholder="Ej.: La cuenta, por favor."></textarea><div id="hint" class="hint hidden"></div><div class="actions"><button id="sendBtn">Pedir la cuenta</button></div>`;if(!mine.text)bindText(stage,'text')}else{const msg=partnerText(stage,['text']);box.innerHTML=mine.replyText?alreadyDone():msg?`<div class="instruction">💶 Da la cuenta al cliente.</div><div class="partnerMsg"><b>${esc(room.participants?.[partnerUid()]?.nick||'Cliente')}:</b> ${esc(msg)}</div>${bill}<label>Tu frase</label><textarea id="textInput" placeholder="Ej.: Son 16 euros."></textarea><div class="actions"><button id="sendBtn">Dar la cuenta</button></div>`:waiting('Espera a que el cliente pida la cuenta.');if(msg&&!mine.replyText)bindText(stage,'replyText')}}
 if(stage===6){if(role==='waiter'){box.innerHTML=mine.goodbyeText?alreadyDone():formBox('👋 Despídete del cliente.','','Ej.: Muchas gracias. Hasta luego.');if(!mine.goodbyeText)bindText(stage,'goodbyeText')}else{const msg=partnerText(stage,['goodbyeText']);box.innerHTML=mine.goodbyeText?alreadyDone():msg?formBox('👋 Responde y despídete.',msg,'Ej.: Gracias. Hasta luego.'):waiting('Espera la despedida del camarero.');if(msg&&!mine.goodbyeText)bindText(stage,'goodbyeText')}}
}
function bindText(stage,key){const btn=$('#sendBtn'),ta=$('#textInput');if(!btn||!ta)return;ta.oninput=()=>{const h=$('#hint'),txt=softHint(stage,myRole(),ta.value);if(h){h.textContent='💡 '+txt;h.classList.toggle('hidden',!txt)}};btn.onclick=async()=>{const text=ta.value.trim();if(!text)return;btn.disabled=true;await set(tRef(stage),{[key]:text,at:nowServer()})}}
function bindChoice(stage,choiceKey,textKey){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',x===b));$('#sendBtn').disabled=false});$('#sendBtn').onclick=async()=>{const text=$('#textInput').value.trim();if(!selected||!text)return;$('#sendBtn').disabled=true;await set(tRef(stage),{[choiceKey]:selected,[textKey]:text,at:nowServer()})}}
function bindMissionWaiter(stage){document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{selected=b.dataset.item;document.querySelectorAll('[data-item]').forEach(x=>x.classList.toggle('selected',x===b));$('#sendBtn').disabled=false;$('#wrong').classList.add('hidden')});$('#sendBtn').onclick=async()=>{const text=$('#textInput').value.trim();if(!selected||!text)return;$('#sendBtn').disabled=true;await set(tRef(stage),{selectedItem:selected,replyText:text,at:nowServer()})}}
function buildBill(){const o=roundPair()?.order||{},d=DRINKS[o.drinkKey],f=FOODS[o.foodKey],total=(d?.price||0)+(f?.price||0);return `<div class="bill"><b>LA CUENTA</b>${d?`<div class="billRow"><span>${d.label}</span><span>${d.price.toFixed(2).replace('.',',')} €</span></div>`:''}${f?`<div class="billRow"><span>${f.label}</span><span>${f.price.toFixed(2).replace('.',',')} €</span></div>`:''}<div class="billRow total"><span>TOTAL</span><span>${total.toFixed(2).replace('.',',')} €</span></div></div>`}
setInterval(()=>{if(!room?.state?.roundEndsAt||room.state.status!=='playing')return;const left=Math.max(0,room.state.roundEndsAt-nowServer()),m=Math.floor(left/60000),s=Math.floor((left%60000)/1000);$('#timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')},250);
</script></body></html>
