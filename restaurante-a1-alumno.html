.scene.entering .client{animation:clientEnter .8s ease both}.scene.drink .waiter{transform:translateX(55px)}.scene.food .waiter{transform:translateX(70px)}.scene.serving .waiter{animation:serveWalk 2.1s ease-in-out infinite}.scene.serving .tray,.scene.mission .tray{opacity:1;transform:translateY(0) scale(1)}.scene.serving .steam{opacity:1;animation:steamUp 1.5s ease-out infinite}.scene.mission .waiter{transform:translateX(42px)}.scene.bill .receiptScene{opacity:1;animation:receiptDrop .55s ease both}.scene.goodbye .client{transform:translateX(20px)}.scene.goodbye .waiter{transform:translateX(-12px)}

</style>

<body><div class="wrap">
<section id="join" class="card"><span class="badge">A1 · Restaurante</span><h1 style="margin-top:10px">🍽️ Entra en la partida</h1><label>Código</label><input id="roomInput" inputmode="numeric" maxlength="6" placeholder="123456"><label>Tu nombre</label><input id="nickInput" maxlength="22" placeholder="Marta"><div class="actions"><button id="joinBtn" class="green">Entrar</button></div><div id="joinStatus" class="muted" style="margin-top:9px"></div></section>

    <div class="roleCard"><div><div id="roundLabel" class="muted">RONDA 1</div><div id="roleName" class="roleName">—</div><div id="partnerName" class="muted"></div></div><div id="timer" class="timer"><small>TIEMPO</small>05:00</div></div>

</section>
</div>
<script type="module">

const FOODS={pizza:{label:'Pizza margarita',price:10,emoji:'🍕'},ensalada:{label:'Ensalada',price:9,emoji:'🥗'},pasta:{label:'Pasta',price:11,emoji:'🍝'},hamburguesa:{label:'Hamburguesa',price:12,emoji:'🍔'},paella:{label:'Paella',price:14,emoji:'🥘'},tortilla:{label:'Tortilla española',price:8,emoji:'🥔'},bocadillo:{label:'Bocadillo',price:7,emoji:'🥖'},croquetas:{label:'Croquetas',price:9,emoji:'🧆'}};
const ITEMS=[['servilleta','🧻','servilleta'],['tenedor','🍴','tenedor'],['cuchillo','🔪','cuchillo'],['cuchara','🥄','cuchara'],['pan','🥖','pan'],['agua','💧','agua'],['sal','🧂','sal']];
const HINTS={
 '0_waiter':['Palabras útiles: saludo · mesa · personas','Muy buenas. ¿Para cuántas personas?'],
 '0_client':['Palabras útiles: somos · dos','Somos dos.'],
 '1_waiter':['Piensa en el verbo tomar.','¿Qué quieres tomar?'],
 '1_client':['Puedes usar: para mí · quiero · por favor','Para mí, una limonada, por favor.'],
 '2_waiter':['Piensa en el verbo comer.','¿Qué quieres comer?'],
 '2_client':['Puedes usar: quiero · para mí · por favor','Quiero la tortilla, por favor.'],

 '6_client':['Responde con una despedida corta.','Gracias. Hasta luego.']
};
const params=new URLSearchParams(location.search);if(params.get('room'))$('#roomInput').value=params.get('room').replace(/\D/g,'').slice(0,6);$('#nickInput').value=localStorage.getItem('restaurante_a1_nick')||'';
onValue(ref(db,'.info/serverTimeOffset'),s=>serverOffset=Number(s.val()||0));signInAnonymously(auth).catch(e=>$('#joinStatus').textContent='Firebase: '+e.message);onAuthStateChanged(auth,u=>user=u);$('#joinBtn').onclick=join;
const nowServer=()=>Date.now()+serverOffset,esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pairState(){return pairId?room?.pairs?.[pairId]:null}

function myRole(){const p=pairState();return p?.waiterUid===user?.uid?'waiter':p?.clientUid===user?.uid?'client':null}
function partnerUid(){const p=pairState(),r=myRole();return r==='waiter'?p?.clientUid:r==='client'?p?.waiterUid:null}
function basePairData(){return pairId?room?.rounds?.[room.state?.round]?.pairs?.[pairId]||{}:{}}
function roundPair(){const base=basePairData(),c=cycleNo();return base?.cycles?.[c]||(c===1?base:{})}
function tRef(stage){return ref(db,`roleplays/${code}/rounds/${room.state.round}/pairs/${pairId}/cycles/${cycleNo()}/turns/${stage}/${user.uid}`)}
async function join(){
 if(!user){$('#joinStatus').textContent='Todavía conectando…';return}const c=$('#roomInput').value.replace(/\D/g,'').slice(0,6),n=$('#nickInput').value.trim().replace(/\s+/g,' ').slice(0,22);if(c.length!==6){$('#joinStatus').textContent='Escribe 6 números.';return}if(n.length<2){$('#joinStatus').textContent='Escribe tu nombre.';return}$('#joinBtn').disabled=true;
 try{const snap=await get(ref(db,`roleplays/${c}`)),r=snap.val();if(!r||!['roleplay_restaurante_a1_multi_2026','roleplay_restaurante_a1_2026'].includes(r.kind))throw Error('No encuentro esta partida.');const ps=r.participants||{},already=!!ps[user.uid];if(!already&&Object.keys(ps).length>=20)throw Error('La partida está llena.');if(r.state?.status!=='lobby'&&!already)throw Error('La partida ya ha empezado.');code=c;nick=n;localStorage.setItem('restaurante_a1_nick',nick);if(!already)await set(ref(db,`roleplays/${code}/participants/${user.uid}`),{nick,joinedAt:serverTimestamp()});$('#join').classList.add('hidden');$('#waiting').classList.remove('hidden');$('#waitNick').textContent=nick;subscribe();}
 catch(e){$('#joinStatus').textContent=e.message;$('#joinBtn').disabled=false}
}
function subscribe(){onValue(ref(db,`roleplays/${code}`),s=>{const oldCycle=cycleNo();room=s.val()||null;const newPair=room?.pairingOf?.[user.uid]||null;if(newPair!==pairId||oldCycle!==cycleNo()){pairId=newPair;mission=null;lastRenderKey='';missionSubKey=''}render()})}
let missionUnsub=null;function subscribeMission(){const key=(pairId&&room?.state?.round)?`${room.state.round}/${pairId}/${cycleNo()}/${user?.uid}`:'';if(!key||key===missionSubKey)return;if(missionUnsub)missionUnsub();mission=null;missionSubKey=key;missionUnsub=onValue(ref(db,`roleplayMissions/${code}/${room.state.round}/${pairId}/${user.uid}`),s=>{mission=s.val()||null;renderTask(true)})}
function render(){if(!room)return;const st=room.state||{};if(st.status==='lobby')return;if(st.status==='finished'){$('#waiting').classList.add('hidden');$('#game').classList.remove('hidden');$('#task').innerHTML='<div class="done"><div style="font-size:64px">👋</div><h2>Partida terminada</h2></div>';return}if(st.status!=='playing'||!pairId)return;subscribeMission();$('#waiting').classList.add('hidden');$('#game').classList.remove('hidden');const role=myRole(),p=pairState();if(!role||!p)return;$('#roundLabel').textContent=`MESA ${pairId.replace(/\D/g,'')} · VUELTA ${cycleNo()}/2`;$('#roleName').textContent=role==='waiter'?'🧑‍🍳 CAMARERO/A':'🧑 CLIENTE/A';$('#partnerName').textContent='Con: '+(room.participants?.[partnerUid()]?.nick||'—');renderScene();renderTask()}

function partnerTurn(stage){return roundPair()?.turns?.[stage]?.[partnerUid()]||{}}function myTurn(stage){return roundPair()?.turns?.[stage]?.[user.uid]||{}}function partnerText(stage,keys){const t=partnerTurn(stage);for(const k of keys)if(t[k])return t[k];return ''}

function renderTask(force=false){if(!room||room.state?.status!=='playing'||!pairId)return;const stage=Number(pairState()?.stage||0),role=myRole(),cycle=cycleNo(),key=`${room.state.round}|${pairId}|${cycle}|${stage}|${role}|${JSON.stringify(myTurn(stage))}|${JSON.stringify(partnerTurn(stage))}|${JSON.stringify(pairState()?.swapReady||{})}|${mission?.key||''}`;if(!force&&key===lastRenderKey)return;lastRenderKey=key;selected=null;const box=$('#task');
 if(stage>=7){renderFinishedCycle(box);return}const mine=myTurn(stage);
 if(stage===0){if(role==='waiter'){box.innerHTML=mine.text?alreadyDone():formBox(stage,role,'👋 Saluda al cliente y pregunta para cuántas personas es la mesa.','','Enviar');if(!mine.text){bindHelp(stage,role);bindText(stage,'text')}}else{const msg=partnerText(stage,['text']);box.innerHTML=mine.text?alreadyDone():msg?formBox(stage,role,'👥 Responde: ¿cuántas personas sois?',msg,'Responder'):waiting('Espera el saludo del camarero.');if(msg&&!mine.text){bindHelp(stage,role);bindText(stage,'text')}}}
 if(stage===1){if(role==='waiter'){box.innerHTML=mine.askText?alreadyDone():formBox(stage,role,'🥤 Pregunta al cliente qué quiere tomar.','','Preguntar');if(!mine.askText){bindHelp(stage,role);bindText(stage,'askText')}}else{const msg=partnerText(stage,['askText']);if(mine.clientText)box.innerHTML=alreadyDone();else if(!msg)box.innerHTML=waiting('Espera la pregunta del camarero.');else{box.innerHTML=`<div class="instruction">🥤 Mira la carta, elige una bebida y responde con tu propia frase.</div><div class="partnerMsg"><b>${esc(room.participants?.[partnerUid()]?.nick||'Camarero')}:</b> ${esc(msg)}</div><div class="menu">${menuCards(DRINKS)}</div><div id="choiceSummary"></div><label>Tu frase</label><textarea id="textInput" placeholder="Escribe aquí…"></textarea>${helpControls(stage,role)}<div class="actions"><button id="sendBtn" disabled>Enviar pedido</button></div>`;bindHelp(stage,role);bindChoice(stage,'drinkKey','clientText',DRINKS)}}}
 if(stage===2){if(role==='waiter'){box.innerHTML=mine.askText?alreadyDone():formBox(stage,role,'🍽️ Pregunta al cliente qué quiere comer.','','Preguntar');if(!mine.askText){bindHelp(stage,role);bindText(stage,'askText')}}else{const msg=partnerText(stage,['askText']);if(mine.clientText)box.innerHTML=alreadyDone();else if(!msg)box.innerHTML=waiting('Espera la pregunta del camarero.');else{box.innerHTML=`<div class="instruction">🍽️ Mira la carta, elige un plato y responde con tu propia frase.</div><div class="partnerMsg"><b>${esc(room.participants?.[partnerUid()]?.nick||'Camarero')}:</b> ${esc(msg)}</div><div class="menu">${menuCards(FOODS)}</div><div id="choiceSummary"></div><label>Tu frase</label><textarea id="textInput" placeholder="Escribe aquí…"></textarea>${helpControls(stage,role)}<div class="actions"><button id="sendBtn" disabled>Enviar pedido</button></div>`;bindHelp(stage,role);bindChoice(stage,'foodKey','clientText',FOODS)}}}
 if(stage===3){if(role==='waiter'){box.innerHTML=mine.serveText?alreadyDone('🍽️ Pedido servido.'):formBox(stage,role,'🍽️ Lleva la comida a la mesa y di una frase corta.','','Servir pedido');if(!mine.serveText){bindHelp(stage,role);bindText(stage,'serveText')}}else{const msg=partnerText(stage,['serveText']);box.innerHTML=mine.thanksText?alreadyDone():msg?formBox(stage,role,'🙏 Reacciona y da las gracias.',msg,'Responder'):waiting('El camarero está trayendo el pedido…');if(msg&&!mine.thanksText){bindHelp(stage,role);bindText(stage,'thanksText')}}}
 if(stage===4){if(role==='client'){if(mine.text)box.innerHTML=alreadyDone('🕵️ Petición enviada.');else if(!mission)box.innerHTML=waiting('Preparando tu misión secreta…');else{box.innerHTML=`<div class="instruction">🕵️ MISIÓN SECRETA<br><span style="font-size:24px">${esc(mission.emoji)} Necesitas <b>${esc(mission.label)}</b>.</span><br><span class="muted">Pídeselo al camarero. No le enseñes esta tarjeta.</span></div><label>Tu frase</label><textarea id="textInput" placeholder="Escribe aquí…"></textarea>${helpControls(stage,role)}<div class="actions"><button id="sendBtn">Pedir</button></div>`;bindHelp(stage,role);bindText(stage,'text')}}else{const msg=partnerText(stage,['text']),fb=roundPair()?.feedback?.[4]?.[user.uid],wrong=fb?.kind==='wrong-item'&&fb?.selectedItem===mine.selectedItem;if(mine.replyText&&!wrong)box.innerHTML=alreadyDone('✅ Has respondido.');else if(!msg)box.innerHTML=waiting('Espera la petición del cliente.');else{box.innerHTML=`<div class="instruction">👂 Lee el mensaje. Marca lo que ha pedido el cliente y responde.</div><div class="partnerMsg"><b>${esc(room.participants?.[partnerUid()]?.nick||'Cliente')}:</b> ${esc(msg)}</div><div class="checklist">${ITEMS.map(([k,e,l])=>`<button type="button" data-item="${k}">${e} ${l}</button>`).join('')}</div><div id="wrong" class="wrong ${wrong?'':'hidden'}">No es eso. Lee otra vez el mensaje del cliente 👀</div><label>Tu respuesta</label><textarea id="textInput" placeholder="Escribe aquí…"></textarea>${helpControls(stage,role)}<div class="actions"><button id="sendBtn" disabled>Confirmar y responder</button></div>`;bindHelp(stage,role);bindMissionWaiter(stage)}}}
 if(stage===5){const bill=buildBill();if(role==='client'){box.innerHTML=mine.text?alreadyDone('🧾 Cuenta pedida.'):`<div class="instruction">🧾 Ya habéis terminado. Pide la cuenta.</div>${bill}<label>Tu frase</label><textarea id="textInput" placeholder="Escribe aquí…"></textarea>${helpControls(stage,role)}<div class="actions"><button id="sendBtn">Pedir la cuenta</button></div>`;if(!mine.text){bindHelp(stage,role);bindText(stage,'text')}}else{const msg=partnerText(stage,['text']);box.innerHTML=mine.replyText?alreadyDone():msg?`<div class="instruction">💶 Mira el total y da la cuenta al cliente.</div><div class="partnerMsg"><b>${esc(room.participants?.[partnerUid()]?.nick||'Cliente')}:</b> ${esc(msg)}</div>${bill}<label>Tu frase</label><textarea id="textInput" placeholder="Escribe aquí…"></textarea>${helpControls(stage,role)}<div class="actions"><button id="sendBtn">Dar la cuenta</button></div>`:waiting('Espera a que el cliente pida la cuenta.');if(msg&&!mine.replyText){bindHelp(stage,role);bindText(stage,'replyText')}}}
 if(stage===6){if(role==='waiter'){box.innerHTML=mine.goodbyeText?alreadyDone():formBox(stage,role,'👋 Despídete del cliente.','','Despedirse');if(!mine.goodbyeText){bindHelp(stage,role);bindText(stage,'goodbyeText')}}else{const msg=partnerText(stage,['goodbyeText']);box.innerHTML=mine.goodbyeText?alreadyDone():msg?formBox(stage,role,'👋 Responde y despídete.',msg,'Despedirse'):waiting('Espera la despedida del camarero.');if(msg&&!mine.goodbyeText){bindHelp(stage,role);bindText(stage,'goodbyeText')}}}
}
function renderFinishedCycle(box){const c=cycleNo();if(c>=2){box.innerHTML='<div class="done"><div style="font-size:70px">🏁</div><h2>¡Actividad completada!</h2><p>Has practicado los dos roles. Puedes esperar a las otras mesas.</p></div>';return}const ready=pairState()?.swapReady||{},mine=ready[user.uid]===true,other=ready[partnerUid()]===true;box.innerHTML=`<div class="swapCard done"><div style="font-size:62px">🎉</div><h2>¡Primera vuelta terminada!</h2><p>No tienes que esperar a las otras mesas. Cuando los dos estéis listos, podéis cambiar los roles.</p><div class="readyPeople"><span class="readyChip ${mine?'yes':''}">${mine?'✓':'○'} Tú</span><span class="readyChip ${other?'yes':''}">${other?'✓':'○'} ${esc(room.participants?.[partnerUid()]?.nick||'Compañero/a')}</span></div>${mine?'<button class="secondary" disabled>✓ Listo/a para cambiar</button>':'<button id="studentSwapBtn">🔄 Estoy listo/a para cambiar de rol</button>'}<p class="muted" style="margin-top:10px">El cambio empieza cuando los dos pulsáis el botón.</p></div>`;const b=$('#studentSwapBtn');if(b)b.onclick=async()=>{b.disabled=true;await set(ref(db,`roleplays/${code}/pairs/${pairId}/swapReady/${user.uid}`),true)}}
function bindText(stage,key){const btn=$('#sendBtn'),ta=$('#textInput');if(!btn||!ta)return;btn.onclick=async()=>{const text=ta.value.trim();if(!text)return;btn.disabled=true;await set(tRef(stage),{[key]:text,at:nowServer()})}}
function bindChoice(stage,choiceKey,textKey,items){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',x===b));const v=items[selected],sum=$('#choiceSummary');if(sum)sum.innerHTML=`<div class="choiceSummary"><span class="big">${v.emoji}</span><div><b>Tu elección: ${esc(v.label)}</b><div class="muted">Ahora escríbelo al camarero.</div></div></div>`;$('#sendBtn').disabled=false});$('#sendBtn').onclick=async()=>{const text=$('#textInput').value.trim();if(!selected||!text)return;$('#sendBtn').disabled=true;await set(tRef(stage),{[choiceKey]:selected,[textKey]:text,at:nowServer()})}}
function bindMissionWaiter(stage){document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{selected=b.dataset.item;document.querySelectorAll('[data-item]').forEach(x=>x.classList.toggle('selected',x===b));$('#sendBtn').disabled=false;$('#wrong').classList.add('hidden')});$('#sendBtn').onclick=async()=>{const text=$('#textInput').value.trim();if(!selected||!text)return;$('#sendBtn').disabled=true;await set(tRef(stage),{selectedItem:selected,replyText:text,at:nowServer()})}}
function buildBill(){const o=roundPair()?.order||{},d=DRINKS[o.drinkKey],f=FOODS[o.foodKey],total=(d?.price||0)+(f?.price||0);return `<div class="bill"><b>LA CUENTA</b>${d?`<div class="billRow"><span>${d.label}</span><span>${d.price.toFixed(2).replace('.',',')} €</span></div>`:''}${f?`<div class="billRow"><span>${f.label}</span><span>${f.price.toFixed(2).replace('.',',')} €</span></div>`:''}<div class="billRow total"><span>TOTAL</span><span>${total.toFixed(2).replace('.',',')} €</span></div></div>`}
setInterval(()=>{if(!room||room.state?.status!=='playing'||!pairId)return;const end=Number(pairState()?.cycleEndsAt||room.state?.roundEndsAt||0);const left=Math.max(0,end-nowServer()),m=Math.floor(left/60000),s=Math.floor((left%60000)/1000);$('#timer').innerHTML=`<small>TIEMPO · VUELTA ${cycleNo()}/2</small>${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`},250);
</script></body></html>
